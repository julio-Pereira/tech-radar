<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self';" />
  <title>Tech Radar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#0f1117" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="course.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Pular para o conteúdo</a>

  <header>
    <div class="header-inner">
      <h1>Tech Radar</h1>
      <nav class="main-nav" aria-label="Principal">
        <a href="#/" class="nav-link" data-route="radar">Radar</a>
        <a href="#/learn" class="nav-link" data-route="learn">Trilhas</a>
        <a href="#/paths" class="nav-link" data-route="paths">Caminhos</a>
        <a href="#/glossario" class="nav-link" data-route="glossario">Glossário</a>
        <a href="#/skills" class="nav-link" data-route="skills">Competências</a>
        <a href="#/revisar" class="nav-link" data-route="review">Revisar</a>
      </nav>
      <div class="header-search">
        <input id="search-input" type="search" placeholder="Buscar (/)" aria-label="Buscar em trilhas, marcos e glossário" autocomplete="off" />
        <div id="search-results" class="search-results" role="region" aria-label="Resultados da busca" hidden></div>
      </div>
      <span id="generated-at" class="meta"></span>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <!-- Radar view (default route #/) -->
    <div id="view-radar" class="view view-radar">
      <aside class="sidebar">
        <div class="filter-group">
          <label for="search">Buscar</label>
          <input id="search" type="search" placeholder="Filtrar artigos…" autocomplete="off" />
        </div>

        <div class="filter-group">
          <label id="category-filters-label">Categoria</label>
          <div id="category-filters" class="chip-list" role="group" aria-labelledby="category-filters-label"></div>
        </div>

        <div class="filter-group">
          <label id="source-filters-label">Fonte</label>
          <div id="source-filters" class="chip-list" role="group" aria-labelledby="source-filters-label"></div>
        </div>

        <div class="filter-group">
          <button id="clear-btn" class="clear-btn">Limpar filtros</button>
        </div>
      </aside>

      <section class="feed">
        <section id="daily" class="daily hidden">
          <h2 class="daily-title">Leitura de Hoje</h2>
          <div id="daily-cards" class="daily-cards"></div>
        </section>

        <div id="summary" class="summary" aria-live="polite"></div>
        <div id="articles" class="articles"></div>
        <div id="loading" class="loading">Carregando artigos…</div>
        <div id="error" class="error hidden"></div>
      </section>
    </div>

    <!-- Learn view (routes #/learn and #/learn/<slug>) -->
    <div id="view-learn" class="view hidden"></div>
  </main>

  <div id="route-announcer" class="sr-only" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

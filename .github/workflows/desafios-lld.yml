name: Desafios LLD

# Banco de desafios (jornada de entrevistas): cada desafio LLD entrega ao
# leitor um esqueleto e uma suíte de testes. Este job prova as duas metades
# do contrato: os testes FALHAM no esqueleto e PASSAM na solução de
# referência (Go com -race, Java com Maven).

on:
  pull_request:
    paths:
      - 'aggregator/content/desafios/**'
      - 'tools/desafios/**'
      - '.github/workflows/desafios-lld.yml'
  push:
    branches: [main]
    paths:
      - 'aggregator/content/desafios/**'
      - 'tools/desafios/**'
      - '.github/workflows/desafios-lld.yml'

permissions: {}

jobs:
  lld:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'aggregator/content/desafios/**/pom.xml'

      - name: Skeleton fails, reference passes
        run: tools/desafios/check-lld.sh aggregator/content/desafios

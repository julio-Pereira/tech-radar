name: Build & Deploy

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

# Nothing by default: each job asks for what it needs. Only deploy writes to Pages.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: aggregator/go.mod
          cache-dependency-path: aggregator/go.sum

      - name: Download dependencies
        working-directory: aggregator
        run: go mod download

      # Guards the trilhas: a course that fails to compile is skipped with a
      # WARN and would otherwise vanish from the site without turning CI red.
      - name: Test
        working-directory: aggregator
        run: go test ./...

      - name: Run aggregator
        working-directory: aggregator
        env:
          OUTPUT_FILE: ../web/data/feed.json
        run: go run .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  # The same checks every PR runs, again on the commit being deployed: a red
  # test or a lint finding never reaches the site.
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/web-tests.yml

  deploy:
    needs: [build, lint, e2e]
    runs-on: ubuntu-latest
    # Required by actions/deploy-pages, and granted to this job only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

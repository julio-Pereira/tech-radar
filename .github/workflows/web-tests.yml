name: Web UI tests

# Every PR runs it on its own; Build & Deploy calls it (workflow_call) before
# deploying, so a red suite never reaches the site.
on:
  pull_request:
  workflow_call:

permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: aggregator/go.mod
          cache-dependency-path: aggregator/go.sum

      - name: Download Go dependencies
        working-directory: aggregator
        run: go mod download

      # Standalone module (no dependency on the aggregator) meant to be
      # copied into the reader's own fin-platform repo — verified here so a
      # broken allowlist or check runner never reaches main unnoticed.
      - name: Test fin-check CLI
        working-directory: tools/fin-check
        run: |
          go vet ./...
          go test ./...

      # Same build the site ships: without it, web/data/ doesn't exist and
      # every test that fetches a course or the feed fails on a 404.
      - name: Generate web/data/
        working-directory: aggregator
        env:
          OUTPUT_FILE: ../web/data/feed.json
        run: go run .

      # Visual coverage per track (diagram plan, Fase 5): informs, never
      # gates — the compiler is what refuses an ASCII diagram.
      - name: Diagram coverage report
        working-directory: aggregator
        run: |
          go run ./cmd/cobertura > ../cobertura-diagramas.md
          cat ../cobertura-diagramas.md >> "$GITHUB_STEP_SUMMARY"

      # Desafio formulas reach the browser as an AST walked by a tiny
      # interpreter (PLANO jornada de entrevistas §5.3): no dynamic code
      # evaluation anywhere in the front end, ever.
      - name: No eval / new Function in the front end
        run: |
          if grep -rnE '\beval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|set(Timeout|Interval)[[:space:]]*\([[:space:]]*["'"'"'`]' \
               web/js web/index.html; then
            echo "::error::dynamic code evaluation found (see lines above)"
            exit 1
          fi

      - name: Upload diagram coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-diagramas
          path: cobertura-diagramas.md
          retention-days: 30

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install test dependencies
        working-directory: web
        run: npm ci

      # Pure-function tests (the spaced-review scheduler) — no browser, no
      # dependency, runs in milliseconds; fails the build independently of
      # the Playwright suite below.
      - name: Run unit tests (node --test)
        working-directory: web
        run: npm run test:unit

      # Chromium only — Playwright's own cache key already covers the browser
      # directory, so a Firefox/WebKit download never happens.
      - name: Install Playwright's Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright + axe-core
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

    ate: 1
  - legenda: "O relay publica: o evento sai pelo menos uma vez"
    ate: 2
  - legenda: "O ledger-core consome: inbox e lançamento na mesma transação"
    ate: 4
  - legenda: "O broker reentrega o mesmo evt-1, por projeto, não por bug"
    ate: 5
  - legenda: "A chave do inbox barra o duplicado: um efeito só no negócio"
    ate: 6

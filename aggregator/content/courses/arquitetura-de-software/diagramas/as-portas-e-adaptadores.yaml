id: as-portas-e-adaptadores
tipo: topologia
titulo: "Portas e adaptadores: o núcleo define a porta, e o mesmo teste prova os dois adaptadores"
descricao: >
  O adaptador HTTP chama o caso de uso, a porta de entrada, mapeando o DTO para o domínio. As setas de baixo significam implementa.
  O núcleo usa a porta de saída de persistência, que ele mesmo declara. Três adaptadores a
  implementam: o SQL, o em memória usado nos testes do núcleo, e a ACL que fala com o
  legado. O mesmo teste de contrato roda contra o adaptador em memória e o SQL; se os dois
  passam, o núcleo de fato não percebe a diferença.
grupos:

id: as-camadas
tipo: topologia
titulo: "Em camadas: cada uma chama a de baixo, e o domínio depende dos dados"
descricao: >
  Na arquitetura em camadas, a apresentação chama a aplicação, que chama o domínio, que
  chama a camada de dados. A dependência desce até o banco: o domínio conhece a
  persistência. Os vícios recorrentes aparecem nessa pilha: o sinkhole, em que a chamada
  atravessa camadas só repassando parâmetros, e a camada de passagem, que todo mundo pula
  para ir direto aos dados.

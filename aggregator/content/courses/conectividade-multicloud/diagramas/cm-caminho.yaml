id: cm-caminho
tipo: topologia
titulo: "O caminho privado do ledger-core ao score: o FCR é o único salto que roteia entre nuvens"
descricao: >
  O ledger-core, na VNet do fin-platform, sai pelo ExpressRoute Gateway e pelo circuito até o Fabric
  Cloud Router, no metro de São Paulo. O FCR entrega o tráfego à perna do Google: o VLAN attachment e
  o Cloud Router na VPC do fornecedor, onde está a API de score. Um segundo parceiro entra com mais
  uma conexão no mesmo FCR, e o filtro por conexão impede que ele enxergue o fornecedor.

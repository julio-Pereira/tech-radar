id: cm-p99
tipo: grafico
titulo: "O p99 do score subiu às duas da manhã e não voltou: o tráfego ficou no caminho secundário"
descricao: >
  O p99 da chamada de score fica em torno de 15 ms enquanto o tráfego usa o caminho primário, com o
  FCR no mesmo metro das duas regiões. Às duas da manhã, a manutenção programada do provedor
  derruba o primário, e o failover leva o tráfego para o secundário, em outro metro, onde o p99
  sobe para cerca de 90 ms, acima do orçamento de 40 ms. A manutenção termina, mas o tráfego não
  volta sozinho. Sem um painel que mostre o caminho ativo ao lado da latência, o alerta de manhã
  aponta para o fornecedor. Dados ilustrativos.
forma: linha

  - { de: azure, para: fin, rotulo: "service key", tipo: reply, nota: "a cobrança começa aqui" }
  - { de: forn, para: gcp, rotulo: "cria VLAN attachment", tipo: sync }
  - { de: gcp, para: forn, rotulo: "pairing key /1", tipo: reply }
  - { de: forn, para: fin, rotulo: "envia pairing key", tipo: async, nota: "validade limitada (conferir)" }
  - { de: fin, para: fabric, rotulo: "conexão com service key", tipo: sync }
  - { de: fabric, para: azure, rotulo: "provisiona circuito", tipo: sync, nota: "Provisioned" }
  - { de: fin, para: fabric, rotulo: "conexão com pairing key", tipo: sync }
  - { de: fabric, para: gcp, rotulo: "configura attachment", tipo: sync, nota: "PENDING_CUSTOMER" }
  - { de: forn, para: gcp, rotulo: "ativa attachment", tipo: sync, nota: "ACTIVE" }
  - { de: fin, para: azure, rotulo: "private peering e gateway", tipo: sync, nota: "só agora há rota" }

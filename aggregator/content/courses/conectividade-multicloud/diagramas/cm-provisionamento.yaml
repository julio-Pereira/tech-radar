id: cm-provisionamento
tipo: sequencia
titulo: "Duas chaves, duas organizações: a ordem que leva do pedido à rota anunciada"
descricao: >
  O fin-platform cria o circuito ExpressRoute e recebe a service key, e a cobrança começa ali. Do
  outro lado, o fornecedor cria o VLAN attachment na organização dele e manda a pairing key, que tem
  validade limitada. Com as duas chaves, o fin-platform cria as duas conexões do Fabric. O Azure
  passa o circuito a Provisioned; o attachment vai a PENDING_CUSTOMER e só o fornecedor o ativa.
  Por último vêm o private peering e a ligação do gateway: só então há rota.
participantes:
  - { id: fin, rotulo: "fin-platform" }
  - { id: azure, rotulo: "Azure" }
  - { id: fabric, rotulo: "Equinix Fabric", papel: destaque }
  - { id: gcp, rotulo: "Google Cloud", papel: externo }
  - { id: forn, rotulo: "fornecedor", papel: externo }
mensagens:

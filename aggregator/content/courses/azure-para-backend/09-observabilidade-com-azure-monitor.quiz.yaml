questions:
  - question: "O regulador pediu a lista de identidades que leram a chave de cifra do ledger nos últimos seis meses. O Key Vault tem RBAC e purge protection, mas nenhum diagnostic setting. O que dá para responder?"
    options:
      - "Tudo, pelo Activity Log da assinatura, que registra cada leitura de chave do cofre e guarda o registro por 90 dias"
      - "Tudo, pelas métricas de plataforma do Key Vault, que são automáticas e guardam cada operação, com a identidade de quem a chamou, por 93 dias"
      - "Nada sobre as leituras: o log de auditoria do recurso não é coletado sem diagnostic setting, e o Activity Log registra quem mudou o cofre"
      - "Só as leituras feitas pelo portal ou pela CLI, que vão automaticamente para o log de auditoria do tenant no Entra ID, com a identidade"
    answer: 2
    explanation: "Os resource logs não são coletados por padrão: só existem depois de um diagnostic setting, e só dali em diante. O Activity Log registra operações do plano de controle (quem mudou o cofre, a política, o papel), não quem leu a chave, e o Azure o guarda por 90 dias. A métrica de plataforma é agregada e não identifica quem fez cada operação."

  - question: "O time quer guardar a auditoria por cinco anos e mudou o `retention_in_days` do workspace inteiro para 1.825. O que está errado no desenho?"
    options:
      - "Nada: a retenção é sempre definida por workspace, e todas as tabelas dele precisam seguir a retenção mais longa exigida"
      - "A retenção longa é por tabela: subir o workspace inteiro guarda também a depuração por anos, e a ingestão só inclui 31 dias"
      - "O Log Analytics não passa de dois anos de retenção em nenhum plano de tabela, por isso o valor de 1.825 dias é recusado pela API"
      - "O Activity Log não pode ir para um workspace com retenção acima de 90 dias"
    answer: 1
    explanation: "Cada tabela tem um plano e uma retenção. A interativa vai até 2 anos, e a total, com a retenção longa, até 12 anos (nov 2026). A auditoria (`AzureActivity`, `AZKVAuditLogs`) ganha a retenção total da política; o resto fica nos 30 dias. A ingestão em Analytics inclui 31 dias, e cada dia além disso soma GB-mês cobrado: o marco 11 mediu 13.360 GB-mês num workspace de 40 GB por dia com 365 dias."

  - question: "O `pix-gateway` em Java precisa mandar traces para o Application Insights e para o Tempo, no mesmo desenho. Qual caminho?"
    options:
      - "O SDK clássico do Application Insights com a chave de instrumentação, mais um exportador para o Tempo"
      - "Um recurso clássico do Application Insights, que aceita OTLP e repassa para o Tempo"
      - "A Distro do Azure Monitor (o agente 3.x) exportando OTLP para o Collector, que manda para os dois"
      - "O OTel no serviço exportando OTLP para o Collector, que manda para o Azure Monitor e para o Tempo"
    answer: 3
    explanation: "O agente Java da Distro manda para o Application Insights e não exporta OTLP. Para dois destinos, o serviço é instrumentado com OTel e o Collector escolhe o destino (`observabilidade/05`). O modelo clássico acabou: a ingestão nos recursos clássicos parou em 15 jun 2025, e todo Application Insights é baseado em workspace."

  - question: "O alerta de 429 do Cosmos disparou várias vezes por dia, com a latência dentro do SLO. O que fazer?"
    options:
      - "Alertar pela taxa de 429 e pela latência, não pelo primeiro 429: o SDK refaz o 429 sozinho, e de 1% a 5% com latência aceitável é saudável"
      - "Dobrar as RU/s provisionadas do contêiner, porque qualquer 429 devolvido pelo Cosmos é uma requisição perdida pelo cliente"
      - "Desligar o retry automático do SDK, para que todo 429 chegue à aplicação e seja tratado lá, junto com o resto dos erros de negócio do ledger"
      - "Trocar o alerta de métrica por uma consulta ao Activity Log"
    answer: 0
    explanation: "O SDK do Cosmos refaz o 429 automaticamente, e a documentação considera saudável de 1% a 5% de 429 com a latência aceitável. O alerta que acorda alguém é sobre a taxa e a latência. Aumentar RU/s faz sentido quando o `NormalizedRUConsumption` fica perto de 100% em várias partições e a taxa passa de 5%; se é uma partição só, a causa é a chave (marco 07)."

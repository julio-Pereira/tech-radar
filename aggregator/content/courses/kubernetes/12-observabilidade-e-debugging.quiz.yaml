questions:
  - question: "Um pod está Pending há 10 minutos e não há nada nos logs. Onde está a resposta?"
    options:
      - "No log do kubelet do nó"
      - "Em kubectl describe pod, na seção Events — o scheduler escreve ali por que não encontrou nó"
      - "No log do etcd"
      - "Em kubectl logs --previous"
    answer: 1
    explanation: "Não há log porque não há container: o pod nunca foi criado. O Kubernetes quase sempre já escreveu o motivo; o problema é que ninguém abriu o describe."
  - question: "Por que kubectl logs não ajuda num CrashLoopBackOff, e o que você usa?"
    options:
      - "Ajuda normalmente"
      - "O container atual pode nem ter subido; use kubectl logs --previous para ver o container anterior"
      - "Use kubectl describe node"
      - "Use kubectl top pod"
    answer: 1
    explanation: "E lembre que o log é efêmero: se o pod sumir, ele some junto. É por isso que log centralizado não é luxo — o pod que morreu é exatamente o que você quer investigar."
  - question: "Como debugar rede num pod cuja imagem é distroless, sem shell?"
    options:
      - "Trocar a imagem por uma com shell e redeployar"
      - "kubectl debug com um ephemeral container, injetando ferramentas no pod que está rodando"
      - "kubectl cp de um binário de shell"
      - "Não é possível"
    answer: 1
    explanation: "Ephemeral containers compartilham o namespace de processo do container alvo, sem reiniciar nada. É o que torna a imagem mínima do marco 09 viável na prática."
  - question: "Por que 'pod reiniciando' pode não ser incidente e 'taxa de autorização caiu' é?"
    options:
      - "Porque reinício é sempre esperado"
      - "Porque alerta deve ser por sintoma que o usuário sente: pods reiniciando com o serviço atendendo não afeta ninguém; autorização caindo é dinheiro perdido"
      - "Porque a taxa de autorização é mais fácil de medir"
      - "Porque reinício é responsabilidade da plataforma"
    answer: 1
    explanation: "Causa vai para dashboard e runbook; sintoma vai para o pager. O alerta de infraestrutura que dispara sem impacto é o que produz alert fatigue."

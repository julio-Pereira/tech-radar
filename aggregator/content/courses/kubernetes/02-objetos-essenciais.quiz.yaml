questions:
  - question: "Um Service com selector errado não gera nenhum evento de erro. Por quê?"
    options:
      - "Porque o API server valida o selector no momento da criação do Service"
      - "Porque os eventos desse tipo vêm desabilitados por padrão no cluster"
      - "Porque o erro só é registrado no log do kube-proxy, não como evento"
      - "Porque conjunto vazio é resultado válido: o Service existe e não tem endpoints"
    answer: 3
    explanation: "Labels são o único mecanismo de ligação e não há integridade referencial. kubectl get endpointslices é o diagnóstico, e é o primeiro comando quando 'o Service não responde'."
  - question: "O que torna o rollback de um Deployment instantâneo?"
    options:
      - "Um snapshot do estado anterior guardado pelo etcd a cada revisão"
      - "O ReplicaSet antigo continua existindo com 0 réplicas"
      - "O cache de imagens no nó, que dispensa novo pull no registry"
      - "Uma annotation no Deployment que carrega o YAML da revisão anterior"
    answer: 1
    explanation: "O Deployment gerencia ReplicaSets; o antigo não é deletado. Por isso o rollback é uma mudança de contagem, e não um redeploy — mas ele não desfaz migração de banco."
  - question: "Você escalou um Deployment com kubectl scale durante um pico. O que precisa acontecer antes de ir dormir?"
    options:
      - "Um PR que torne a mudança permanente, senão o próximo apply a desfaz"
      - "Nada: a mudança já está persistida no etcd e sobrevive a reinícios"
      - "Reiniciar o controller-manager para que ele assuma a nova contagem"
      - "Registrar a alteração no wiki do time para a passagem de plantão"
    answer: 0
    explanation: "Imperativo para investigar, declarativo para mudar. Mudança que só existe no cluster é desfeita no pior momento — pelo Argo CD, inclusive —, não sobrevive à recriação do ambiente, e não tem revisor nem justificativa para a auditoria."
  - question: "Por que labels de time e centro de custo devem entrar no dia 1?"
    options:
      - "Porque a API do Kubernetes as exige em todo objeto de workload"
      - "Porque um índice de labels menor acelera as decisões do scheduler"
      - "Porque o selector de um Deployment é imutável e retrofitar exige recriar"
      - "Porque o kubectl apply recusa manifests de workload sem essas chaves"
    answer: 2
    explanation: "Além do custo de recriação, cada label vira insumo depois: rateio de FinOps, policies de admissão e desenho de NetworkPolicy."

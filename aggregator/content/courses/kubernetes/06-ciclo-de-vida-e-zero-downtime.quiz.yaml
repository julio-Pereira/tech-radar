questions:
  - question: "Por que o pod continua recebendo requisições depois de receber SIGTERM?"
    options:
      - "Porque o kube-proxy só remove o endpoint no próximo ciclo de sincronização"
      - "Porque a remoção do EndpointSlice é assíncrona em relação ao SIGTERM"
      - "Porque o objeto Service mantém cache dos endpoints por alguns segundos"
      - "Porque o SIGTERM só é entregue depois que o drain do nó termina"
    answer: 1
    explanation: "São dois caminhos paralelos sem sincronia: a propagação para o kube-proxy de cada nó corre em separado. Por isso o preStop que espera alguns segundos é a prática recomendada — não existe sinal de 'a rede convergiu'."
  - question: "Qual a diferença de efeito entre liveness e readiness falhando?"
    options:
      - "Liveness tira o pod do balanceamento; readiness reinicia o container"
      - "As duas reiniciam o container, com timeouts padrão diferentes"
      - "Liveness reinicia o container; readiness tira o pod do balanceamento"
      - "São equivalentes na prática, e a readiness apenas reage mais rápido"
    answer: 2
    explanation: "Confundir as duas é o erro clássico: uma liveness que depende do banco transforma lentidão em reinício em massa, e o reinício derruba o que ainda funcionava."
  - question: "Sua readiness checa o PSP externo e ele caiu. O que acontece com o tráfego que não precisa do PSP?"
    options:
      - "Para também: todos os pods ficam NotReady e o Service perde os endpoints"
      - "Continua sendo atendido, porque a readiness só afeta o caminho do PSP"
      - "É redirecionado para a região secundária pelo balanceador global"
      - "Fica enfileirado no kube-proxy até a dependência externa voltar"
    answer: 0
    explanation: "Readiness responde 'eu estou pronto', não 'o mundo está bem'. Checar dependência externa transforma a falha do parceiro numa indisponibilidade total sua."
  - question: "kubectl rollout undo desfez o deploy. O que ele não desfez?"
    options:
      - "A tag da imagem do container definida na revisão anterior"
      - "As variáveis de ambiente que a revisão nova havia acrescentado"
      - "O número de réplicas ajustado junto com a revisão problemática"
      - "A migração de banco que a versão nova aplicou ao subir"
    answer: 3
    explanation: "Por isso toda migração precisa ser compatível com a versão anterior — expandir, migrar, contrair. Rollback automático de canary não te salva de um schema incompatível."

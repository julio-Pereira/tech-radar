questions:
  - question: "Por que create pods num namespace equivale, na prática, a ler todos os Secrets dele?"
    options:
      - "Porque o RBAC concede o verbo get em secrets junto com create em pods"
      - "Porque todos os Secrets do namespace são montados em todo pod criado"
      - "Porque quem cria pod monta qualquer Secret e assume qualquer ServiceAccount"
      - "Porque o kubelet expõe os Secrets do nó por uma API local sem autenticação"
    answer: 2
    explanation: "É o que torna a separação por namespace uma fronteira de segurança real e 'dar deploy' uma permissão muito mais forte do que parece."
  - question: "Qual a diferença entre RoleBinding apontando para um ClusterRole e ClusterRoleBinding apontando para o mesmo ClusterRole?"
    options:
      - "O RoleBinding concede só no seu namespace; o ClusterRoleBinding, no cluster"
      - "Nenhuma: os dois concedem as mesmas permissões em todo o cluster"
      - "Um RoleBinding só pode referenciar Role, nunca um ClusterRole"
      - "O ClusterRoleBinding é o mais restritivo dos dois em qualquer cenário"
    answer: 0
    explanation: "A combinação RoleBinding→ClusterRole é útil e pouco conhecida: define a regra uma vez e concede namespace a namespace. Trocar por ClusterRoleBinding por engano abre o cluster inteiro."
  - question: "Por que o verbo escalate é equivalente a cluster-admin?"
    options:
      - "Porque ele desabilita a avaliação de RBAC para o sujeito que o possui"
      - "Porque ele permite editar a configuração de flags do próprio API server"
      - "Porque ele autoriza a criação de ClusterRoleBindings arbitrários"
      - "Porque quem o tem em roles pode conceder a si mesmo qualquer permissão"
    answer: 3
    explanation: "escalate e bind passam despercebidos em review porque parecem verbos técnicos inofensivos. Na prática são a chave do cofre."
  - question: "Por que o audit log precisa sair do cluster?"
    options:
      - "Porque o volume de escrita degrada o desempenho do etcd sob carga"
      - "Porque quem compromete o cluster pode apagar a prova"
      - "Porque o formato JSON estruturado não é legível sem uma ferramenta externa"
      - "Porque o kubelet rotaciona e descarta esses arquivos a cada hora cheia"
    answer: 1
    explanation: "A trilha precisa estar fora do alcance de quem ela audita, idealmente em storage write-once. E a policy precisa ser seletiva por nível, senão o volume fica caro o bastante para alguém decidir desligá-la."

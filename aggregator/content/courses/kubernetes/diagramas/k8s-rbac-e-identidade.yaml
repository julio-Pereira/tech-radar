id: k8s-rbac-e-identidade
tipo: topologia
titulo: "RBAC e identidade de workload: o que o pix-gateway pode no cluster, e fora dele"
descricao: >
  Dentro do cluster, a identidade do pix-gateway é a sua ServiceAccount. Um RoleBinding no
  namespace pix aponta para um ClusterRole leitor, definido uma vez e concedido namespace a
  namespace, e o resultado é só o verbo e o recurso que faltavam, como get em configmaps. Fora
  do cluster, nenhuma chave estática: o kubelet monta no pod um token OIDC projetado, de vida
  curta e com audience específica; o IAM do provedor confia no emissor do cluster e troca o token
  por uma credencial temporária, que lê o Secret Manager ou o bucket.

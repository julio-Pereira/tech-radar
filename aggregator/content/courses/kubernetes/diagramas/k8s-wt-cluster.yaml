  - { de: api, para: etcd, rotulo: "grava" }
  - { de: api, para: kcm, rotulo: "watch" }
  - { de: kcm, para: api, rotulo: "cria objetos" }
  - { de: api, para: sched, rotulo: "watch" }
  - { de: sched, para: api, rotulo: "Binding" }
  - { de: api, para: proxy, rotulo: "EndpointSlice" }

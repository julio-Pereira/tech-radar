id: k8s-wt-cluster
tipo: topologia
titulo: "No cluster, todo componente fala só com o API server, nunca um com o outro"
descricao: >
  O kubectl envia a declaração ao API server, que a grava no etcd e responde. O
  controller-manager e o scheduler mantêm um watch no API server: recebem as mudanças por
  ele e escrevem de volta por ele, sem nunca falar um com o outro nem com os nós. O
  kube-proxy de cada nó também observa o API server, e é por ele que fica sabendo dos
  endpoints de um Service. Os dois nós de trabalho do cluster kind fin-platform aparecem
  embaixo; o worker2 é onde o Pod deste roteiro vai rodar.
grupos:
  - { id: cp, rotulo: "control plane", col: 1, row: 0, cols: 2, rows: 2 }
  - { id: nos, rotulo: "nós de trabalho", col: 0, row: 2, cols: 3, rows: 2 }
nos:
  - { id: kubectl, rotulo: "kubectl", col: 0, row: 1, papel: externo, icone: cliente }
  - { id: etcd, rotulo: "etcd", grupo: cp, col: 1, row: 0, icone: banco }
  - { id: api, rotulo: "kube-apiserver", grupo: cp, col: 1, row: 1, papel: destaque, icone: plataforma }
  - { id: sched, rotulo: "kube-scheduler", grupo: cp, col: 2, row: 0, icone: plataforma }
  - { id: kcm, rotulo: "kube-controller-manager", grupo: cp, col: 2, row: 1, icone: plataforma }
  - { id: proxy, rotulo: "kube-proxy (cada nó)", grupo: nos, col: 1, row: 2, icone: rede }
  - { id: worker, rotulo: "fin-platform-worker", grupo: nos, col: 0, row: 3, icone: plataforma }
  - { id: worker2, rotulo: "fin-platform-worker2", grupo: nos, col: 2, row: 3, papel: destaque, icone: plataforma }
arestas:

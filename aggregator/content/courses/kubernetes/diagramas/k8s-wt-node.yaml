id: k8s-wt-node
tipo: topologia
titulo: "No nó, o kubelet puxa o trabalho do API server e manda o containerd executar"
descricao: >
  Dentro do nó fin-platform-worker2, o kubelet mantém um watch no API server só para os
  Pods atribuídos a este nó e devolve o status deles pelo mesmo API server. Para executar,
  ele fala com o containerd pela interface CRI: o containerd cria o sandbox, chama o plugin
  CNI para ligar o Pod à rede e cria o container. O kubelet roda as probes direto no Pod;
  nenhum outro componente do control plane fala com o nó.

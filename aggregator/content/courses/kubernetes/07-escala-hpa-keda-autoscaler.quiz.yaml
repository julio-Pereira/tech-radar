questions:
  - question: "Por que a CPU pode cair quando um serviço I/O-bound satura?"
    options:
      - "Porque o kernel reduz a frequência do processador sob temperatura alta"
      - "Porque as threads ficam bloqueadas esperando I/O, e o que cresce é a fila"
      - "Porque o coletor de lixo entra em modo econômico ao detectar espera"
      - "Porque o HPA já removeu réplicas ao ver a utilização média baixando"
    answer: 1
    explanation: "É por isso que HPA por CPU não escala um serviço em colapso, e ainda escala depois, na recuperação, quando o backlog é processado. Escale por RPS, concorrência ou lag."
  - question: "Do pico começar até a capacidade nova atender, o tempo típico é de:"
    options:
      - "Poucos segundos, já que o HPA reage a cada scrape do metrics server"
      - "Menos de um minuto quando o cluster usa Karpenter em vez do autoscaler"
      - "2 a 7 minutos: reação, provisionamento de nó, pull da imagem e boot"
      - "O tempo depende apenas do scrape interval configurado no Prometheus"
    answer: 2
    explanation: "Se o seu pico sobe em 30 segundos, nenhuma configuração de autoscaler resolve. Pico previsível se resolve com pré-escala agendada."
  - question: "Por que escalar por latência pode piorar o incidente?"
    options:
      - "Porque a latência alta pode vir da dependência, e mais pods a pressionam"
      - "Porque a latência é a métrica mais cara de coletar em alta cardinalidade"
      - "Porque o HPA não aceita métricas de latência sem um adapter externo"
      - "Porque a latência oscila demais e faz o autoscaler entrar em flapping"
    answer: 0
    explanation: "É o retry storm em outro formato: mais pods multiplicam a carga sobre quem já está sofrendo. Escalar por latência sem entender a causa é adicionar pressão exatamente onde ela não cabe."
  - question: "Por que maxReplicaCount do KEDA nunca deve passar do número de partições do tópico?"
    options:
      - "Porque o KEDA falha ao materializar o HPA acima desse limite"
      - "Porque o broker recusa as conexões dos consumidores excedentes"
      - "Porque o cálculo de lag deixa de ser confiável acima desse número"
      - "Porque consumidores excedentes ficam ociosos e ainda pioram o rebalance"
    answer: 3
    explanation: "Uma partição vai para no máximo um consumidor: os extras custam dinheiro e participam de cada rebalance. O KEDA não te protege desse erro, e o tempo para zerar o backlog não melhora — costuma piorar."

questions:
  - question: "Por que ReadWriteOnce limita a alta disponibilidade que o topology spread prometia?"
    options:
      - "Porque o volume de bloco não aceita expansão depois de provisionado"
      - "Porque o StatefulSet não avalia as regras de topology spread constraints"
      - "Porque o disco de bloco vive numa AZ, e sem ela o pod fica Pending"
      - "Porque o modo impede que o workload tenha mais de uma réplica no cluster"
    answer: 2
    explanation: "Espalhar pods entre zonas não espalha o dado. A alta disponibilidade do workload sem estado não se aplica automaticamente ao workload com estado."
  - question: "Por que snapshot não é backup?"
    options:
      - "Porque costuma viver no mesmo storage do dado original"
      - "Porque a restauração é lenta demais para caber na janela de RTO"
      - "Porque o snapshot não preserva permissões nem metadados do filesystem"
      - "Porque o mecanismo de snapshot não é suportado por volumes do tipo PVC"
    answer: 0
    explanation: "Perdeu a conta ou o storage, perdeu os dois. Backup é cópia fora do domínio de falha, com restore testado. Replicação também não é backup: ela copia o DELETE errado para todas as réplicas em milissegundos."
  - question: "O que o operator Strimzi faz num rolling restart que um StatefulSet cru não faria?"
    options:
      - "Reiniciar os pods na ordem inversa à do índice ordinal do StatefulSet"
      - "Tirar um snapshot de cada volume antes de derrubar o broker correspondente"
      - "Criar automaticamente os tópicos declarados antes de liberar o tráfego"
      - "Esperar o ISR se recompor antes de reiniciar o broker seguinte"
    answer: 3
    explanation: "O StatefulSet garante mecânica (identidade, ordem, disco); a semântica do software é do operator. É o conhecimento operacional virando código que reconcilia, em vez de runbook executado às 3h."
  - question: "Você deletou o StatefulSet e os dados continuam lá. Bug ou feature?"
    options:
      - "Bug: o garbage collector deveria remover os PVCs pela ownerReference"
      - "Feature deliberada: os PVCs sobrevivem e a recriação reconecta aos dados"
      - "Depende do reclaimPolicy configurado na StorageClass usada pelo cluster"
      - "Bug específico do kind, que não implementa a limpeza do provisionador local"
    answer: 1
    explanation: "É proteção contra perda acidental de dado. Ótimo quando é o que você quer, e uma surpresa desagradável quando você achou que tinha limpado o ambiente de desenvolvimento."

questions:
  - question: "Quem escreve o campo nodeName de um pod, e quem cria o container?"
    options:
      - "O kubelet escolhe o nó e escreve nodeName; o scheduler cria o container via CRI"
      - "O controller-manager faz as duas coisas, em sequência, no mesmo reconcile"
      - "O scheduler escreve nodeName; o kubelet pede ao CRI que crie o container"
      - "O API server faz as duas coisas ao admitir o objeto no etcd"
    answer: 2
    explanation: "O scheduler só decide e escreve o campo. O kubelet do nó observa que há um pod atribuído a ele e pede ao runtime (containerd/CRI-O) que o crie. Separação de responsabilidades típica do modelo de controllers."
  - question: "Por que kubectl apply retornar sucesso não significa que a mudança aconteceu?"
    options:
      - "Porque o apply só registra o estado desejado; a convergência vem depois"
      - "Porque o kubectl mantém um cache local e responde antes de falar com a API"
      - "Porque a replicação do etcd entre membros do quórum é assíncrona"
      - "Porque o apply é assíncrono por um bug conhecido do cliente kubectl"
    answer: 0
    explanation: "Não existe transação 'deu certo' no Kubernetes, existe convergência — feita por controllers, que podem demorar ou nunca completar. Um pod pode ficar Pending para sempre sem que nada tenha falhado: o estado desejado simplesmente não é satisfazível."
  - question: "O que o etcd ser o único componente com estado implica?"
    options:
      - "Que uma cópia dele precisa rodar em cada nó de trabalho do cluster"
      - "Que o scheduler e o kubelet o consultam diretamente, sem intermediários"
      - "Que ele pode ser reiniciado sem consequência para os objetos já aplicados"
      - "Que ele é o alvo de backup, de encryption at rest e do controle de acesso"
    answer: 3
    explanation: "Nada fala com o etcd direto — só o API server. E como ele guarda tudo, inclusive Secrets em texto claro por padrão, ele concentra as decisões de backup, criptografia em repouso e acesso."
  - question: "Qual é a lição da aposentadoria do Ingress NGINX em 2026?"
    options:
      - "Que controllers mantidos por terceiros devem ser evitados na plataforma"
      - "Que dependência de plataforma tem prazo de validade, e mapeá-lo é seu trabalho"
      - "Que o Kubernetes é instável demais para cargas de missão crítica"
      - "Que o objeto Ingress nunca deveria ter entrado na API do Kubernetes"
    answer: 1
    explanation: "O controller de entrada mais usado do ecossistema por quase uma década foi aposentado sem sucessor drop-in. Quem tratou 'Ingress' como permanente herdou uma migração não planejada."

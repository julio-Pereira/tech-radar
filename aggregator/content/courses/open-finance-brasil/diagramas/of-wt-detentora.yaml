id: of-wt-detentora
tipo: topologia
titulo: "Dentro da detentora, o consentimento é conferido e consumido antes do débito"
descricao: >
  A iniciação da ITP chega à API de pagamentos do transmissor. Ela confere valor e recebedor
  contra o consentimento, que é consumido e nunca autoriza um segundo movimento. Depois passa por
  limites e antifraude, com o perfil de risco próprio da iniciação por terceiros. Só então debita
  a conta do cliente no fin-books e entrega a ordem ao fin-rails, que fala com o Pix.

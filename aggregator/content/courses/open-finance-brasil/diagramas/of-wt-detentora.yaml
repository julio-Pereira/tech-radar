  - { id: pag, rotulo: "API de pagamentos", grupo: det, col: 1, row: 1, papel: destaque }
  - { id: cons, rotulo: "consentimentos", grupo: det, col: 2, row: 1 }
  - { id: ledger, rotulo: "fin-books (contas)", grupo: det, col: 1, row: 2 }
  - { id: rails, rotulo: "fin-rails (Pix)", grupo: det, col: 2, row: 2 }

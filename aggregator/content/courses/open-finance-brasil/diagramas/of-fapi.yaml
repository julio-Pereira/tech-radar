id: of-fapi
tipo: sequencia
titulo: "FAPI: PAR assinado, PKCE na troca e token vinculado ao certificado"
descricao: >
  O TPP empurra os parâmetros de autorização num request object assinado, pelo PAR, e recebe
  uma referência opaca. O cliente é redirecionado ao servidor de autorização com essa
  referência, autentica e consente. O código volta para a redirect_uri exata, com state e
  nonce. Na troca do código, o TPP prova o PKCE e se autentica por mTLS ou private_key_jwt, e
  recebe um token vinculado ao certificado. A API só aceita o token se a conexão atual usa o
  mesmo certificado.
participantes:
  - { id: tpp, rotulo: "TPP" }
  - { id: cliente, rotulo: "cliente" }
  - { id: as, rotulo: "servidor de autorização", papel: destaque }
  - { id: api, rotulo: "API de dados" }
mensagens:

  - { de: det, para: spi, rotulo: "consulta status", tipo: sync }
  - { de: spi, para: det, rotulo: "liquidado", tipo: reply }
  - { de: det, para: itp, rotulo: "estado terminal", tipo: async, nota: "duplicata não muda o terminal" }

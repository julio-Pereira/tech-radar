id: of-iniciacao
tipo: sequencia
titulo: "Iniciação de pagamento: consentimento de uso único, e o SPI sem resposta se consulta"
descricao: >
  A ITP cria o consentimento de pagamento na detentora, com valor, recebedor e conta de débito
  exatos. O cliente confirma com autenticação forte. A ITP inicia o pagamento com sua chave de
  idempotência, e valor e recebedor precisam ser idênticos aos consentidos. A detentora consome
  o consentimento, que nunca autoriza uma segunda movimentação, e envia a ordem ao SPI. Se o
  SPI não responde no prazo, o resultado é desconhecido: a detentora consulta, nunca reenvia.
  Ao liquidar, notifica a ITP; notificação duplicada ou fora de ordem não muda o estado terminal.
participantes:
  - { id: itp, rotulo: "ITP" }
  - { id: cliente, rotulo: "cliente" }
  - { id: det, rotulo: "detentora", papel: destaque }
  - { id: spi, rotulo: "SPI", papel: externo }
mensagens:

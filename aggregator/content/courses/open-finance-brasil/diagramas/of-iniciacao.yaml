  - { de: itp, para: det, rotulo: "pagamento + idempotência", tipo: sync, nota: "valor e recebedor idênticos" }
  - { de: det, para: det, rotulo: "CONSUMED", tipo: sync }
  - { de: det, para: spi, rotulo: "ordem Pix", tipo: async }

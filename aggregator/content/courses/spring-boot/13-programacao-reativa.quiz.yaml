questions:
  - question: "O que este código imprime?"
    code: |
      var chamadas = new AtomicInteger();
      Mono<String> m = Mono.fromCallable(() -> { chamadas.incrementAndGet(); return "psp"; })
          .map(String::toUpperCase);
      IO.println("montado: " + chamadas.get());
      m.block();
      m.block();
      IO.println("depois: " + chamadas.get());
    options:
      - "montado: 1 e depois: 1"
      - "montado: 0 e depois: 1"
      - "montado: 0 e depois: 2"
      - "montado: 1 e depois: 2"
    answer: 2
    explanation: "Montar o `Mono` só descreve o trabalho: nada roda até a assinatura. E cada assinatura (aqui, cada `block()`) executa a cadeia inteira de novo, então o PSP é chamado duas vezes. Para reaproveitar o resultado, seria preciso `cache()`."

  - question: "Em que threads rodam os três `doOnNext`?"
    code: |
      Flux.just(1)
          .doOnNext(x -> log("A"))
          .publishOn(Schedulers.parallel())
          .doOnNext(x -> log("B"))
          .subscribeOn(Schedulers.boundedElastic())
          .doOnNext(x -> log("C"))
          .blockLast();
    options:
      - "A em boundedElastic, B em parallel, C em parallel"
      - "A em main, B em parallel, C em boundedElastic"
      - "A em parallel, B em parallel, C em boundedElastic"
      - "Os três em boundedElastic, porque o subscribeOn vale para a cadeia toda"
    answer: 0
    explanation: "O `subscribeOn` muda onde a fonte roda, não importa onde esteja escrito: o `just` e o `A` rodam em `boundedElastic`. O `publishOn` muda tudo o que vem depois dele: `B` e `C` rodam em `parallel`. Conferido com o Reactor 3.8.8 no JDK 25."

  - question: "Um *handler* WebFlux chama, dentro de um `map`, um método que consulta a tabela de tarifas por JDBC. O que acontece sob carga?"
    options:
      - "Nada: o WebFlux move o `map` para outra thread quando ele demora a responder"
      - "A chamada segura uma thread do *event loop*, e os clientes dela esperam"
      - "O Reactor detecta o bloqueio e lança `BlockingOperationError` em produção"
      - "O JDBC passa a se comportar de forma reativa dentro do `map`"
    answer: 1
    explanation: "O *event loop* tem poucas threads, e um `map` roda na thread em que o sinal chegou: a chamada bloqueante segura essa thread. Medido: 8 chamadas de 200 ms num *scheduler* de 2 threads levaram ~843 ms; no `boundedElastic`, ~209 ms. O BlockHound acusa em teste, não em produção, e só se estiver instalado."

  - question: "Em que ordem `flatMap` e `concatMap` entregam os resultados?"
    code: |
      Flux<Integer> src = Flux.just(3, 1, 2);
      // cada item demora item × 50 ms
      var fm = src.flatMap(i -> Mono.just(i).delayElement(Duration.ofMillis(i * 50L))).collectList().block();
      var cm = src.concatMap(i -> Mono.just(i).delayElement(Duration.ofMillis(i * 50L))).collectList().block();
      IO.println(fm + " " + cm);
    options:
      - "[3, 1, 2] [3, 1, 2]"
      - "[1, 2, 3] [1, 2, 3]"
      - "[3, 1, 2] [1, 2, 3]"
      - "[1, 2, 3] [3, 1, 2]"
    answer: 3
    explanation: "O `flatMap` assina os três ao mesmo tempo e entrega cada resultado quando ele termina: 1 (50 ms), 2 (100 ms), 3 (150 ms). O `concatMap` assina um de cada vez, na ordem de origem, e preserva essa ordem, ao custo de somar as esperas. Use `concatMap` quando a ordem importa, e `flatMap` com limite quando não importa."

  - question: "Uma fonte `Flux.interval` emite 1 item/ms, e o consumidor processa 1 item a cada 20 ms. Com `onBackpressureBuffer(16)`, o que acontece?"
    options:
      - "O buffer cresce sem limite até o `OutOfMemoryError`"
      - "A fonte desacelera para o ritmo do consumidor, porque o buffer pede menos"
      - "Os itens excedentes são descartados em silêncio depois do décimo sexto"
      - "Depois de 16 itens guardados, a sequência falha com `OverflowException`"
    answer: 3
    explanation: "Uma fonte de tempo não espera `request(n)`, e o operador decide o que fazer com o excesso. `onBackpressureBuffer(16)` guarda até 16 e depois falha com `OverflowException` (conferido no Reactor 3.8.8), em vez de deixar a memória crescer. Descartar é o `onBackpressureDrop`, e um `onBackpressureBuffer()` sem limite é o que leva ao OOM."

  - question: "Um serviço Spring MVC faz, por requisição, três chamadas HTTP e uma consulta JDBC, e precisa atender milhares de requisições concorrentes. Qual a escolha mais defensável no Java 25?"
    options:
      - "Reescrever em WebFlux com R2DBC, porque só o reativo escala com I/O"
      - "Manter o MVC e ligar *virtual threads* (`spring.threads.virtual.enabled`)"
      - "Manter o MVC e aumentar o pool do Tomcat para 5.000 threads de plataforma"
      - "Trocar o JDBC por chamadas em `CompletableFuture` no `commonPool`"
    answer: 1
    explanation: "Com *virtual threads*, a thread que bloqueia em I/O é desmontada da *carrier*, e o código imperativo, com JDBC, `ThreadLocal` e `try/catch`, escala para milhares de requisições concorrentes. O reativo compensa quando o problema é fluxo com *backpressure*, não I/O comum. Milhares de threads de plataforma custam memória, e o `commonPool` não é lugar para I/O."

id: sb-virtual-threads
tipo: topologia
titulo: "Virtual thread: bloqueou no I/O, desmonta e libera a carrier"
descricao: >
  Com virtual threads, milhares de threads leves rodam sobre poucas threads de
  plataforma, as carriers. Quando a VT1 bloqueia esperando o PSP, a JVM a desmonta da
  carrier 1, que fica livre para montar outra virtual thread pronta. Quando o I/O da VT1
  volta, ela fica pronta de novo e é montada em qualquer carrier livre. O código continua
  bloqueante e linear, e escala como assíncrono.

id: sb-ciclo-de-vida-do-bean
tipo: fluxo
titulo: "O proxy nasce no passo 6: é ele, não o seu objeto, que os outros beans recebem"
descricao: >
  Cada singleton passa por uma esteira no refresh do contexto. Primeiro o construtor,
  depois a injeção por campo ou setter, os callbacks Aware e os BeanPostProcessors antes
  da inicialização. Em seguida roda o PostConstruct. No passo 6, os BeanPostProcessors
  depois da inicialização podem devolver outro objeto no lugar do bean: é aqui que nasce
  o proxy de Transactional, Cacheable e Async. O que ficou registrado, bean ou proxy, é o
  que os outros recebem por injeção e atende as requisições, até o PreDestroy no shutdown.

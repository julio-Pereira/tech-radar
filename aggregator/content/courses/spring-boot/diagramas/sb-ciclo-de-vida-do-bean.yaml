  - { id: uso, rotulo: "7. uso", col: 1, row: 1 }
  - { id: destroy, rotulo: "8. @PreDestroy", col: 0, row: 1 }
  - { id: proxy, rotulo: "proxy embrulha o bean", col: 2, row: 2 }

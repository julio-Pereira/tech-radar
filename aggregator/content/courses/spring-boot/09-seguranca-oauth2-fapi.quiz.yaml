questions:
  - question: "O que significa o `pix-gateway` ser um resource server?"
    options:
      - "Ele emite tokens para as instituições participantes e valida o uso de cada um deles"
      - "Ele recebe e valida JWT emitido por um authorization server externo, sem fazer login"
      - "Ele mantém sessão do usuário e converte o cookie em token nas chamadas internas"
      - "Ele intermedeia o fluxo de autorização, trocando o código pelo token em nome do cliente"
    answer: 1
    explanation: "A responsabilidade dele é validar: baixa o JWKS do issuer, confere assinatura, expiração e emissor, e converte os escopos do token em authorities. Emitir token, manter sessão e conduzir o fluxo de autorização são papéis do authorization server — e é justamente por não acumulá-los que a configuração se resume ao `issuer-uri`."

  - question: "Por que combinar autorização por URL com `@PreAuthorize` na camada de serviço?"
    options:
      - "Porque a regra por URL não consegue avaliar o escopo presente no token, só o caminho"
      - "Porque o método security roda antes do filter chain, cortando a requisição mais cedo"
      - "Porque a regra fica perto do negócio e sobrevive a um controller novo que esqueceu o matcher"
      - "Porque `@PreAuthorize` é a única forma de comparar o valor da requisição com um limite"
    answer: 2
    explanation: "É defesa em profundidade: o matcher protege o caminho conhecido, e a anotação protege a regra onde ela mora — inclusive se alguém expuser o serviço por um controller novo. Ela também compara valores da requisição, e o filter chain continua rodando antes; nada disso substitui a outra camada."

  - question: "O que um certificate-bound access token resolve?"
    options:
      - "Dispensa o mTLS, já que o próprio token passa a carregar a identidade da instituição"
      - "Permite revogar o token sem consultar o authorization server, bastando verificar o certificado apresentado"
      - "Elimina a necessidade de validar assinatura, porque o certificado já autentica a origem"
      - "Torna o token roubado inútil: sem a chave privada do certificado, ele não pode ser usado"
    answer: 3
    explanation: "É o fim do bearer token que qualquer um usa: o token carrega uma confirmação amarrada ao certificado do cliente, e o servidor recusa a apresentação por quem não detém a chave privada. Ele depende do mTLS para funcionar, não o substitui, e a validação de assinatura do JWT continua acontecendo normalmente."

  - question: "Qual é a postura correta em relação aos endpoints do Actuator?"
    options:
      - "Expor o mínimo e proteger o resto: `env`, `heapdump` e `loggers` nunca são públicos"
      - "Expor tudo na rede interna, já que o cluster isola o tráfego externo por padrão"
      - "Manter o padrão do Boot, que já expõe somente aquilo que é considerado seguro para ambiente público"
      - "Desabilitar o Actuator em produção e habilitá-lo sob demanda durante incidentes"
    answer: 0
    explanation: "São endpoints poderosos: `env` mostra variáveis, incluindo segredo; `heapdump` despeja a memória; `loggers` muda comportamento em runtime. Tratá-los como superfície de ataque significa incluir só `health` e `prometheus` e autenticar o resto. Desligar em produção tira a ferramenta justamente quando ela é necessária."

  - question: "Por que é seguro desligar a proteção CSRF no `pix-gateway`?"
    options:
      - "Porque o JWT é assinado, e o servidor detecta qualquer requisição forjada pela assinatura"
      - "Porque o mTLS do FAPI já impede que outro site envie requisições em nome do cliente"
      - "Porque o CORS bloqueia as requisições de outras origens antes de chegarem ao controller"
      - "Porque a credencial vai no header `Authorization`, e o navegador não a anexa sozinho"
    answer: 3
    explanation: "CSRF explora a credencial que o navegador anexa automaticamente — o cookie. O gateway não usa cookie nem sessão: o token precisa ser colocado no header pelo cliente em cada chamada, e um site malicioso não consegue fazer isso. A assinatura não ajuda, porque o atacante estaria usando o token legítimo; e CORS não impede o envio de toda requisição."

  - question: "Um token expirado e uma requisição sem token são ambos recusados com `401`. Que evento o Spring Security publica em cada caso?"
    options:
      - "Uma falha de autenticação para o token expirado e uma negativa de autorização para a requisição sem token"
      - "Uma negativa de autorização nos dois casos, porque nenhum dos dois chega a ter uma identidade"
      - "Uma falha de autenticação nos dois casos, porque o `401` sempre indica credencial inválida"
      - "Nenhum evento: o filtro do resource server responde antes de o Spring Security publicar algo"
    answer: 0
    explanation: "O token expirado é rejeitado ao ser decodificado, sem nunca virar identidade: `AuthenticationFailureBadCredentialsEvent`. A requisição sem token segue como anônima e é negada na autorização: `AuthorizationDeniedEvent`, com o principal `anonymousUser`. Um listener de auditoria precisa ouvir os dois para registrar todas as negativas."

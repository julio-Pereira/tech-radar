id: aso-saldo-atual
tipo: topologia
titulo: "Estado atual: saldo vive em três lugares, e ninguém decidiu qual copia qual"
descricao: >
  Hoje, a capacidade saldo aparece em três sistemas: no core bancário, no ledger-core e numa
  planilha da tesouraria mantida à mão para relatório interno. Os três coexistem sem que
  ninguém tenha decidido qual é o sistema de registro, então a pergunta sobre qual valor está
  certo quando dois discordam não tem resposta.

id: aso-landing-zone
tipo: topologia
titulo: "Zona de pouso: a fundação vem antes de qualquer serviço, e nega por padrão"
descricao: >
  A zona de pouso existe antes do primeiro serviço: identidade e acesso, rede, registro
  central e política como código. A política nega por padrão, exige etiquetas de dono, custo
  e ambiente, e só admite exceção com prazo. Produção e desenvolvimento ficam em contas
  separadas, sem confiança implícita entre elas, o que limita o raio de explosão de um erro
  de configuração ou de uma credencial vazada.

id: dd-wt-2pc
tipo: topologia
titulo: "No 2PC, o coordenador é o único que sabe o desfecho, e os locks esperam por ele"
descricao: >
  Um servidor de aplicação coordena, por 2PC, o débito no banco do fin-store e a publicação do
  evento numa fila. Os dois participantes votam ao coordenador e esperam a decisão dele. Enquanto
  esperam, o banco segura os locks da conta, e outro Pix da mesma conta, que nada tem a ver com a
  transação, também espera. Sem coordenador, os plantonistas olham as transações preparadas e
  decidem à mão em cada participante. A reconciliação D+1 compara os lançamentos do banco com os
  eventos publicados na fila e avisa os plantonistas da divergência.
nos:
  - { id: outro, rotulo: "outro Pix", col: 0, row: 0, papel: externo, icone: servico }

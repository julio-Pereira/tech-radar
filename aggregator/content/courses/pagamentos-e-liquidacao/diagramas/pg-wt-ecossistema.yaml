id: pg-wt-ecossistema
tipo: topologia
titulo: "No ecossistema, o dinheiro só muda de dono quando o SPI liquida"
descricao: >
  O pagador usa o aplicativo do seu PSP. O PSP do pagador busca a cobrança hospedada pelo PSP
  do recebedor, consulta o DICT para traduzir a chave Pix na conta de destino e envia a ordem ao
  SPI. O SPI encaminha a ordem ao PSP do recebedor, recebe o aceite e liquida a transação
  individualmente, debitando e creditando as contas de liquidação dos dois PSPs. Depois confirma
  aos dois lados, e o PSP do recebedor credita a conta do lojista.
nos:
  - { id: pagador, rotulo: "pagador (app)", col: 0, row: 0, papel: externo }
  - { id: psp-pa, rotulo: "PSP do pagador", col: 1, row: 0, papel: destaque }
  - { id: psp-pb, rotulo: "PSP do recebedor", col: 2, row: 0 }
  - { id: recebedor, rotulo: "recebedor (loja)", col: 3, row: 0, papel: externo }
  - { id: dict, rotulo: "DICT", col: 0, row: 1 }
  - { id: spi, rotulo: "SPI", col: 2, row: 1, papel: destaque }
  - { id: liq, rotulo: "contas de liquidação", col: 2, row: 2 }

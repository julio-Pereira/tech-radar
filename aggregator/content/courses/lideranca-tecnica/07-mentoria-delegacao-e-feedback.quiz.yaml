questions:
  - question: "Um líder técnico indica o nome de uma engenheira sênior para liderar um projeto visível numa reunião em que ela não está presente, sem antes ensinar nada a ela sobre o assunto. Segundo este marco, que ferramenta é essa?"
    options:
      - "Patrocínio — abrir uma oportunidade concreta para a pessoa quando ela não está na sala"
      - "Mentoria — compartilhar a própria experiência para ajudar a pessoa a crescer e ganhar visibilidade no projeto"
      - "Coaching — ajudar a pessoa a encontrar a própria resposta através de perguntas"
      - "Delegação de nível 'contar' — decidir e apenas informar a pessoa depois"
    answer: 0
    explanation: "O marco distingue patrocínio justamente por essa característica: usar credibilidade para criar oportunidade quando a pessoa não está presente para se autopromover. Não é mentoria (não há compartilhamento de experiência aqui), não é coaching (não há pergunta nem resposta sendo elaborada), e não é delegação (não há uma tarefa sendo atribuída com decisão a ser tomada)."
  - question: "Um gestor delega uma tarefa dizendo apenas 'cuide disso', sem especificar resultado esperado, restrições ou quando ele vai querer saber do andamento. Segundo este marco, qual é o problema central dessa delegação?"
    options:
      - "Sem nível declarado, a pessoa não sabe se tinha autonomia ou se devia consultar antes"
      - "O problema é que a tarefa foi delegada, quando deveria ter sido feita pelo próprio gestor"
      - "Não há problema — delegação eficaz é justamente dar liberdade total, sem nenhuma estrutura"
      - "O problema é usar linguagem informal ('cuide disso') em vez de um memorando formal por escrito"
    answer: 0
    explanation: "O marco explica que delegação funciona quando declara resultado, restrições, checkpoints e nível explícito — a ambiguidade do nível é o que deixa a pessoa delegada numa posição incerta sobre o grau de autonomia esperado. O problema não é delegar em si (delegação bem feita é recomendada), não é sobre liberdade total sem estrutura (isso também é ambíguo), e não é sobre formalidade da linguagem usada."
  - question: "Um gestor diz a um membro do time: 'você é desorganizado e isso está atrapalhando o projeto'. Segundo o modelo SBI discutido neste marco, o que está faltando nesse feedback?"
    options:
      - "Faltam a situação e o comportamento observável; 'desorganizado' é julgamento de caráter"
      - "Nada está faltando — esse feedback já segue perfeitamente o modelo situação-comportamento-impacto"
      - "Falta só uma data específica no fim da frase"
      - "O feedback está correto, mas deveria ter sido dado em uma avaliação formal trimestral, não no momento"
    answer: 0
    explanation: "O marco contrasta exatamente esse tipo de frase ('você é descuidado') com um exemplo SBI real — o problema é que 'desorganizado' julga o caráter da pessoa em vez de descrever um comportamento específico observável numa situação determinada, seguido do impacto real causado. Adicionar só uma data não resolve a ausência de situação e comportamento; e o marco recomenda feedback rápido e específico, não acumulado para avaliações formais."
  - question: "Ao calcular o fator-ônibus de um repositório, o modelo do fin-leadkit agrega a concentração de conhecimento por área do código, nunca por pessoa nomeada. Segundo este marco, por que essa escolha de design é inegociável?"
    options:
      - "Porque métrica por pessoa vira vigilância; o objetivo é achar risco no sistema, não ranquear"
      - "Porque é tecnicamente impossível calcular fator-ônibus por pessoa a partir de um histórico de commits"
      - "Porque a métrica por área é mais fácil de calcular do ponto de vista puramente computacional"
      - "A escolha não é inegociável — é apenas uma preferência de implementação que poderia ser revertida sem problema"
    answer: 0
    explanation: "O marco é claro: o cálculo por área, nunca por pessoa, existe para evitar que a métrica vire vigilância individual — o objetivo é encontrar onde o conhecimento está concentrado como risco sistêmico, não apontar indivíduos. Não é uma questão de viabilidade técnica (seria perfeitamente calculável por pessoa) nem de facilidade de implementação, e a salvaguarda ética da trilha trata essa escolha como não negociável, não como preferência reversível."
  - question: "Depois de ler sobre segurança psicológica, um líder conclui que o time deveria evitar qualquer forma de desacordo ou crítica para manter o ambiente 'seguro'. Segundo este marco, o que essa conclusão ignora?"
    options:
      - "Que os times mais eficazes combinam segurança psicológica com padrão alto de excelência"
      - "Segurança psicológica não tem relação com desempenho de equipe"
      - "A conclusão está correta — evitar todo desacordo é exatamente o que a pesquisa sobre segurança psicológica recomenda"
      - "O marco afirma que segurança psicológica só é relevante para times muito grandes, acima de 20 pessoas"
    answer: 0
    explanation: "O marco é explícito sobre o que a pesquisa NÃO diz: segurança psicológica não significa ausência de desacordo ou de padrão alto — os times mais eficazes combinam as duas coisas, e uma sem a outra produz conforto sem resultado (ou medo sem aprendizado, no caso oposto). A pesquisa tem relação direta com desempenho (é um dos achados mais robustos sobre times de alto desempenho), e não há menção a tamanho mínimo de time para a relevância do conceito."
  - question: "O diretor diz que o Time Pix 'parou de entregar'. O fluxo mostra o WIP dobrado em seis semanas e o plantão concentrado numa única área. Segundo este marco, qual é o próximo passo?"
    options:
      - "Escrever ao menos duas hipóteses com evidência e testar a mais sustentada com uma ação reversível"
      - "Conversar a sós com quem entrega menos, já que a queda deve ser falta de empenho"
      - "Criar uma reunião diária de acompanhamento de tarefas até o throughput do time voltar ao patamar anterior"
      - "Não repassar o comentário do diretor, para proteger o time, e esperar que o fluxo se normalize sozinho"
    answer: 0
    explanation: "O diagnóstico por sintoma parte dos sinais nos dados, usa o 1:1 para o que os dados não mostram, escreve ao menos duas hipóteses concorrentes com evidência e termina numa primeira ação reversível com critério de reversão (aqui, limitar o WIP por duas semanas). Atribuir a queda a falta de empenho é hipótese de caráter sem evidência; mais um ritual aumenta a carga de um time já sobrecarregado; e esconder a percepção da diretoria passa da proteção contra ruído para a omissão."

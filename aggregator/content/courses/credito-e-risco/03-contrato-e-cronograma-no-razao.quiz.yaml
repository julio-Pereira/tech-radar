questions:
  - question: "Um pagamento parcial em atraso chega, cobrindo apenas parte do que é devido (multa, juros de mora e principal somados). Segundo este marco, por que a ordem em que esse valor é imputado aos diferentes componentes importa para o cálculo correto do saldo remanescente?"
    options:
      - "A ordem (tipicamente encargos → juros → principal) define o que sobra devido e a receita reconhecida"
      - "A ordem só importa para o relatório ao cliente; o saldo remanescente é o mesmo qualquer que seja a imputação"
      - "A ordem só importa quando o pagamento quita tudo, porque é aí que o contrato precisa fechar cada componente"
      - "A ordem é escolha de implementação, e o sistema pode aplicar primeiro ao principal para reduzir os juros futuros"
    answer: 0
    explanation: "A ordem de imputação decide a quais componentes o valor vai primeiro; aplicá-la errado distorce o saldo remanescente e a receita de juros. Com o mesmo valor pago, imputar ao principal ou aos encargos deixa saldos diferentes (principal gera juros, encargo não necessariamente); no pagamento integral a ordem pouco importa, porque tudo é quitado; e a ordem é regra do produto e da regulação (conferir), não escolha livre."
  - question: "Um cliente renegocia um contrato de crédito em atraso. Segundo este marco, como essa renegociação deveria ser modelada no sistema?"
    options:
      - "Liquidar o contrato antigo e originar um novo, com o saldo remanescente como principal"
      - "Editar os termos do contrato existente e registrar a versão anterior num histórico de alterações"
      - "Manter o contrato e adicionar um evento de renegociação que troca taxa e prazo a partir dali"
      - "Cancelar o contrato antigo e abrir um novo, sem vínculo, para não contaminar o histórico de atraso"
    answer: 0
    explanation: "O marco modela renegociação como liquidar o antigo e originar um novo com os termos renegociados, preservando o original imutável e o rastro entre os dois. Editar com histórico ainda muda o contrato original; um evento que troca termos no mesmo contrato mistura dois contratos numa só identidade; e cancelar sem vínculo apaga justamente o rastro auditável (e o histórico de atraso que a provisão do marco 09 precisa)."
  - question: "O pagamento de uma parcela chega duas vezes ao sistema, devido a uma retentativa do banco pagador. Segundo este marco, como a segunda ocorrência duplicada deveria ser tratada no razão?"
    options:
      - "Com um estorno explícito, mantendo intacto o lançamento original"
      - "Editando o lançamento original para refletir que só um pagamento ocorreu de fato"
      - "Registrando os dois pagamentos e deixando a diferença como crédito do cliente no contrato"
      - "Descartando a segunda ocorrência na entrada, antes de ela chegar a gerar qualquer lançamento"
    answer: 0
    explanation: "O marco aplica a disciplina de estorno de `ledger-e-contabilidade/03`: a correção é um lançamento novo que desfaz o efeito, nunca a edição do original — e no exemplo é isso que deixa a conciliação em zero. Editar viola a imutabilidade do razão; registrar os dois aplica o pagamento duas vezes; e, no cenário do marco, o dinheiro duplicado entrou, então descartá-lo sem lançamento deixa o razão sem registro do que aconteceu."
  - question: "Um sistema só verifica se o saldo devedor calculado pelo cronograma do contrato bate com o saldo derivado dos lançamentos do razão durante uma auditoria anual programada, sem nenhuma verificação contínua entre essas auditorias. Segundo este marco, por que essa cadência é insuficiente?"
    options:
      - "Conciliar é um relatório contínuo, vazio no normal; anual, a divergência vira mistério meses depois"
      - "A auditoria anual basta se o razão for imutável, já que lançamentos imutáveis não podem divergir do contrato"
      - "A cadência anual basta para contratos em dia; a conciliação contínua só é exigida para contratos em atraso"
      - "O problema é só regulatório: a norma exige conciliação mensal, e o sistema deveria apenas aumentar a frequência"
    answer: 0
    explanation: "O marco trata a conciliação contrato × razão como relatório contínuo, vazio no caso normal e apontando o contrato divergente assim que algo dá errado. Imutabilidade impede edição, não lançamento errado; contratos em dia também divergem por bug de cálculo ou postagem; e o argumento do marco é de engenharia (detectar cedo), não de cumprir uma periodicidade normativa."

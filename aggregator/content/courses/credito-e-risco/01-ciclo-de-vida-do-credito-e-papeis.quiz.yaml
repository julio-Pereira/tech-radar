questions:
  - question: "Um contrato de crédito recebe um evento que tentaria movê-lo de 'liquidado' de volta para 'vigente', por conta de um erro de reprocessamento. Segundo este marco, o que deveria acontecer?"
    options:
      - "Recusar a transição: 'liquidado' é terminal, e reabrir exige um mecanismo explícito e auditado"
      - "Aceitar a transição, já que o reprocessamento parte dos mesmos eventos e tende a corrigir o estado"
      - "Aceitar e registrar um alerta para revisão manual posterior, sem bloquear o fluxo do reprocessamento"
      - "Apagar o evento de liquidação e reaplicar a sequência, para que o estado volte a refletir o reprocessamento"
    answer: 0
    explanation: "Estados terminais não têm transição de saída: qualquer tentativa de reabri-los precisa de um mecanismo explícito e auditado, nunca de uma reversão silenciosa só porque um reprocessamento pediu. Aceitar (com ou sem alerta) aplica exatamente a transição proibida, e apagar o evento de liquidação viola a imutabilidade dos eventos que o marco toma de `arquitetura-eventos/07`."
  - question: "Um sistema de crédito rotativo (cartão) é modelado usando exatamente a mesma estrutura de dados de um contrato fechado (com cronograma fixo de parcelas desde a concessão). Segundo este marco, por que essa escolha de modelagem tende a ser um erro?"
    options:
      - "Rotativo é uso e pagamento repetidos sem cronograma fixo; fechado tem cronograma definido na concessão — exigem modelos distintos"
      - "Rotativo costuma ter taxa maior que o fechado, e o modelo único não consegue guardar duas faixas de taxa diferentes no mesmo campo"
      - "Rotativo não tem garantia real e o fechado normalmente tem, e a garantia é o que define qual modelo de dados o produto precisa usar"
      - "Rotativo pode ser tratado como contrato fechado de uma parcela por fatura, então o erro está só em não renovar o contrato a cada mês"
    answer: 0
    explanation: "O marco aponta essa como a diferença mais relevante para o desenho do sistema: no rotativo o cliente usa e paga repetidamente, sem cronograma fixo; no fechado, valor, prazo e cronograma são definidos na concessão. Taxa e garantia variam entre produtos, mas não são o que separa os modelos, e emular o rotativo como uma sequência de contratos de uma parcela ignora justamente o uso e pagamento contínuos."
  - question: "Um sistema mantém o saldo devedor de um contrato como um campo atualizado diretamente a cada operação, em paralelo à sequência de eventos do contrato (desembolso, pagamentos, juros). Segundo este marco, por que esse design contradiz a ideia do contrato como fonte da verdade?"
    options:
      - "O saldo deve ser calculado dos eventos; um campo paralelo vira uma segunda verdade que pode divergir"
      - "O campo paralelo é aceitável desde que atualizado na mesma transação dos eventos, o que elimina a chance de divergência"
      - "O problema é só de desempenho: recalcular o saldo dos eventos a cada leitura fica caro, mas o campo em si não contradiz nada"
      - "O campo paralelo só contradiz a ideia em contratos rotativos, porque no fechado o saldo é previsível pelo cronograma original"
    answer: 0
    explanation: "Para o marco, o contrato e sua sequência de eventos são a fonte da verdade; saldo e parcela são consequências calculadas, nunca campos mantidos em paralelo. Atualizar na mesma transação reduz a janela, mas mantém duas verdades que um bug pode separar; o argumento não é de desempenho; e o contrato fechado também tem pagamentos, atrasos e antecipações que afastam o saldo do cronograma original."
  - question: "A mesma chave de idempotência de um comando de contrato de crédito é enviada duas vezes, por uma retentativa de rede. Segundo este marco, o que deveria acontecer com o estado do contrato na segunda vez?"
    options:
      - "Nada muda: a mesma chave garante que o comando repetido não produz um segundo efeito"
      - "O estado avança de novo, porque cada chamada de rede é uma requisição distinta que precisa ser processada"
      - "A segunda chamada é rejeitada com erro de conflito, e o chamador precisa consultar o estado para saber o que houve"
      - "Depende do estado atual: em estados terminais a repetição é ignorada; nos demais, o comando é reaplicado normalmente"
    answer: 0
    explanation: "O marco exige que repetir o mesmo comando, pela mesma chave, não mude o estado mais de uma vez. Avançar de novo é exatamente o efeito duplicado a evitar; responder com erro empurra para o chamador um problema que a idempotência resolve (a resposta deve ser a mesma do primeiro processamento); e a garantia vale em qualquer estado, não só nos terminais."

questions:
  - question: "Um empréstimo de R$ 10.000,00 a 2,00% a.m. em 12 parcelas é calculado pela Tabela Price e, separadamente, pelo SAC. Segundo este marco, qual diferença estrutural explica por que o SAC produz um total de juros menor que o Price no mesmo prazo e taxa?"
    options:
      - "No SAC a amortização constante derruba o saldo mais cedo, e os juros incidem sobre um saldo menor"
      - "No SAC a taxa efetiva do contrato é menor, porque a parcela decrescente compensa parte da capitalização composta do período"
      - "No Price os juros são calculados sobre o principal original em todas as parcelas, enquanto no SAC incidem sobre o saldo"
      - "No Price o ajuste de centavos na última parcela acumula juros extras, que somados explicam a diferença entre os dois totais"
    answer: 0
    explanation: "Com amortização constante, o SAC reduz o saldo devedor mais rápido no início, e os juros de cada mês incidem sobre esse saldo menor (R$ 1.300,00 contra R$ 1.347,15 no exemplo). A taxa é a mesma 2,00% a.m. nos dois; o Price também calcula juros sobre o saldo (R$ 200,00 na 1ª, R$ 185,09 na 2ª); e o ajuste da última parcela é de centavos, não de R$ 47."
  - question: "Um contrato tem uma tarifa de R$ 150,00 financiada à parte, fazendo o cliente receber líquido R$ 9.850,00 enquanto paga parcelas calculadas sobre R$ 10.000,00 a uma taxa nominal de 2,00% a.m. Segundo este marco, o que o CET calculado para esse contrato deveria refletir?"
    options:
      - "Uma taxa acima de 2,00% a.m. (≈ 2,25% no exemplo), que iguala o líquido recebido ao valor presente das parcelas"
      - "Os mesmos 2,00% a.m., já que a tarifa é cobrada à parte e não altera a taxa usada para calcular as parcelas"
      - "Os 2,00% a.m. mais a tarifa dividida pelo prazo, somada linearmente à taxa de cada mês do contrato"
      - "Uma taxa abaixo de 2,00% a.m., porque o valor líquido menor reduz a base sobre a qual os juros incidem"
    answer: 0
    explanation: "O CET é a taxa que iguala o valor líquido recebido (R$ 9.850,00) ao valor presente das parcelas — no exemplo, ≈ 2,25% a.m. A taxa das parcelas não muda, mas o custo real sobe; somar a tarifa linearmente ignora o regime composto e o valor presente; e as parcelas continuam calculadas sobre R$ 10.000,00, então o custo para o cliente sobe, não desce."
  - question: "Uma função que converte uma taxa mensal para sua equivalente anual, e depois converte o resultado de volta para mensal, não devolve a taxa mensal original — a diferença excede qualquer tolerância razoável de arredondamento. Segundo este marco, o que esse resultado indica?"
    options:
      - "Um erro na implementação: no regime composto a ida e volta devolve a taxa original dentro da tolerância"
      - "Um efeito esperado do regime composto, em que a conversão anual acumula juros que não voltam na conversão mensal"
      - "Uma diferença de convenção entre base 360 e 365 dias, que deve ser documentada mas não indica erro no código"
      - "Um sinal de que a taxa de entrada era nominal, e a ida e volta só é garantida quando a entrada já é a taxa efetiva"
    answer: 0
    explanation: "O marco trata a ida e volta como propriedade testável: (1+i)^12 e sua raiz 12 são inversas exatas, então uma divergência acima da tolerância é bug — tipicamente uma conversão linear num dos sentidos. O regime composto não 'perde' juros na volta; base de dias não entra numa conversão entre mês e ano; e a função deveria ser consistente para a entrada que declara aceitar."
  - question: "Um contrato de crédito tem um período de carência inicial em que o cliente não paga nenhuma parcela. Segundo este marco, por que tratar esse período como 'tempo de graça sem custo' é um erro de modelagem?"
    options:
      - "Os juros seguem incidindo na carência e, salvo desenho explícito, são capitalizados ou diferidos"
      - "A carência desloca o vencimento das parcelas, e o erro está só em não recalcular as datas do cronograma"
      - "A carência gera custo apenas no SAC, em que a amortização constante precisa ser redistribuída nas parcelas"
      - "O custo da carência aparece só no CET, como uma tarifa implícita, sem efeito sobre o saldo devedor do contrato"
    answer: 0
    explanation: "Durante a carência os juros continuam incidindo e, conforme o desenho do produto, são capitalizados ao saldo ou diferidos — esse juro precisa aparecer no cronograma. Recalcular datas sem os juros mantém o erro; o efeito existe tanto no Price quanto no SAC; e juros capitalizados mudam o saldo devedor, não só o CET."
  - question: "Um cliente amortiza antecipadamente parte do saldo de seu contrato, optando por manter o prazo original em vez de reduzi-lo. Segundo este marco, o que deveria acontecer com o valor das parcelas restantes, e o que nunca deveria acontecer com o saldo devedor recalculado?"
    options:
      - "As parcelas restantes diminuem, e o saldo recalculado não pode ficar negativo em nenhum ponto"
      - "As parcelas seguem iguais e o valor antecipado vira crédito usado para quitar as últimas parcelas, mantendo o prazo"
      - "As parcelas seguem iguais e o prazo encurta, porque o sistema aplica a variante mais vantajosa para o cliente"
      - "As parcelas diminuem, e o saldo pode ficar negativo por alguns meses se a antecipação superar a parcela seguinte"
    answer: 0
    explanation: "Mantendo o prazo, a variante é 'reduzir a parcela': as parcelas restantes caem. Uma das invariantes exige saldo nunca negativo no cronograma recalculado. Guardar o valor como crédito para as últimas parcelas não recalcula nada; encurtar o prazo contraria a escolha do cliente, que o marco diz ser dele; e saldo negativo é violação de invariante em qualquer caso."
  - question: "Uma implementação de `calc/` usa o tipo `float64` para representar e retornar o valor de uma parcela calculada, embora use tipos decimais em outras partes do código. Segundo este marco, por que essa implementação deveria ser rejeitada num teste de API?"
    options:
      - "Valor monetário em `calc/` só entra e sai como decimal fixo; `float` fica restrito à estatística"
      - "O `float64` é aceitável internamente, e o teste só deveria falhar se o valor exibido ao cliente estiver errado"
      - "O `float64` só causa erro em valores acima de alguns milhões, e o teste deveria limitar o principal aceito"
      - "O `float64` é rejeitado por desempenho: operações decimais são mais rápidas em cronogramas grandes"
    answer: 0
    explanation: "A regra do marco é de API: nenhuma função de `calc/` aceita ou devolve ponto flutuante binário para dinheiro; `float` só é tolerado em estatística (Bloco C). Arredondar na exibição não corrige o erro de representação acumulado; valores como 0,10 já não são exatos em binário, em qualquer magnitude; e a regra é de correção, não de desempenho (decimal costuma ser mais lento)."

id: cr-price-sac
tipo: grafico
titulo: "Price × SAC: parcela constante contra parcela que cai, e R$ 47,15 de juros de diferença"
descricao: >
  Para R$ 10.000,00 a 2% ao mês em 12 parcelas, a Tabela Price cobra R$ 945,60 todo mês, com a
  última ajustada para R$ 945,55 para zerar o saldo. No SAC, a amortização é constante, R$ 833,33,
  e a parcela cai de R$ 1.033,33 para R$ 850,00 porque os juros incidem sobre um saldo que diminui
  mais rápido. Os juros totais são R$ 1.347,15 na Price e R$ 1.300,00 no SAC. Pontos calculados
  por tools/diagramas/curvas.py a partir da fórmula, com o exemplo do marco.
forma: linha
eixo_x: { rotulo: "parcela", tipo: numero }
eixo_y: { rotulo: "valor da parcela (R$)", min: 800, max: 1100 }
series:
  - { id: price, rotulo: "Price", pontos: [[1, 945.6], [2, 945.6], [3, 945.6], [4, 945.6], [5, 945.6], [6, 945.6], [7, 945.6], [8, 945.6], [9, 945.6], [10, 945.6], [11, 945.6], [12, 945.55]] }
  - { id: sac, rotulo: "SAC", pontos: [[1, 1033.33], [2, 1016.67], [3, 1000], [4, 983.33], [5, 966.67], [6, 950], [7, 933.33], [8, 916.67], [9, 900], [10, 883.33], [11, 866.67], [12, 850]] }

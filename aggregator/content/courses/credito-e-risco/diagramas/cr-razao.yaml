id: cr-razao
tipo: fluxo
titulo: "Contrato no razão: desembolso, accrual diário e o pagamento imputado em ordem"
descricao: >
  O desembolso é o primeiro lançamento: débito em empréstimos a receber, um ativo que nasce, e
  crédito em disponibilidades. Os juros são reconhecidos por accrual diário, para o saldo contábil
  refletir o valor econômico da carteira. Quando um pagamento chega, a ordem de imputação aplica
  o valor primeiro aos encargos, depois aos juros e por fim ao principal; um pagamento parcial
  para no meio. O saldo do cronograma e o saldo derivado do razão são conciliados num relatório
  que fica vazio no caso normal.
passos:

id: cr-ciclo
tipo: estados
titulo: "Ciclo de vida do contrato: todo estado tem saída prevista, e os terminais não reabrem"
descricao: >
  A proposta entra em análise e é negada ou aprovada; aprovada e com a CCB assinada, o contrato
  está formalizado, e o desembolso o torna vigente. Vigente, termina liquidado quando o cliente
  quita, ou entra em atraso e vai para a cobrança. Da cobrança, volta a vigente se regulariza,
  é liquidado por uma renegociação, que origina um contrato novo com o saldo remanescente, ou é
  baixado sem recuperação. Liquidado e baixado são terminais: nenhum evento os reabre em
  silêncio, e o mesmo comando repetido não muda o estado duas vezes.

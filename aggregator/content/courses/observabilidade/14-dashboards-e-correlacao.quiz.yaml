questions:
  - question: "Qual pergunta cada um dos três níveis de painel responde?"
    options:
      - "Executivo: \"quanto custou?\"; serviço: \"quem é o dono?\"; debug: \"quando?\""
      - "Executivo: \"estamos bem?\"; serviço: \"o que está errado?\"; debug: \"por quê?\""
      - "Os três respondem \"o que está errado?\", com nível de detalhe crescente"
      - "Executivo e serviço atendem ao negócio; debug atende ao regulador"
    answer: 1
    explanation: "E os três se ligam, formando o caminho de uma investigação. O painel único com 60 gráficos falha porque tenta as três de uma vez e não responde bem a nenhuma: cada nível tem um leitor e uma pergunta."
  - question: "Para que serve um exemplar num histograma?"
    options:
      - "Para reduzir a cardinalidade guardando amostras em vez de séries"
      - "Para preservar um valor de exemplo usado na interpolação do p99"
      - "Para permitir a comparação automática com o mesmo período anterior"
      - "Para ligar o ponto da métrica ao trace daquela requisição"
    answer: 3
    explanation: "Você vê o pico no p99, clica, e abre o trace, sem anotar horário e procurar à mão. É o salto métrica → trace, e cada salto que não existe vira trabalho manual às 3h — exatamente onde o MTTR é ganho ou perdido."
  - question: "Por que um painel construído apenas na UI do Grafana é um problema?"
    options:
      - "Porque ninguém sabe quem mudou o quê e o ambiente novo não o tem"
      - "Porque o JSON gerado pela UI é ineficiente e pesa no carregamento"
      - "Porque painéis criados pela UI não conseguem exibir exemplars"
      - "Porque o Grafana descarta painéis não provisionados a cada atualização"
    answer: 0
    explanation: "É o `kubectl edit` da observabilidade: sem revisão em PR. O fluxo que funciona é editar na UI, exportar e commitar — o ponto não é o formato, é que a fonte da verdade esteja no Git."
  - question: "Qual é o teste definitivo de um painel de plantão?"
    options:
      - "Ter os quatro golden signals presentes e visíveis sem rolagem"
      - "Carregar completamente em menos de dois segundos no horário de pico"
      - "Alguém que não o construiu achar a direção certa em um minuto"
      - "Exibir a linha de referência do SLO em todos os gráficos de latência"
    answer: 2
    explanation: "Durante um incidente simulado — e se falhar, o problema é o painel, não a pessoa. Vale mais que qualquer regra de layout, e é o único critério que mede o painel pelo que ele existe para fazer."

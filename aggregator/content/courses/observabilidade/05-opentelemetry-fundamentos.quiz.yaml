questions:
  - question: "Por que uma biblioteca pode usar a API do OTel sem impor custo a quem a consome?"
    options:
      - "Porque a API do OTel é assíncrona e nunca bloqueia a thread chamadora"
      - "Porque sem um SDK configurado pela aplicação, a API é no-op"
      - "Porque a biblioteca embute o próprio exporter e o desliga por padrão"
      - "Porque o Collector descarta o que não estiver declarado no pipeline"
    answer: 1
    explanation: "A separação API/SDK não é academicismo: é o que torna seguro instrumentar código compartilhado. Quem não configura SDK não paga quase nada."
  - question: "O que quebra se dois serviços nomearem o mesmo conceito de formas diferentes?"
    options:
      - "A exportação via OTLP falha na validação de atributos do payload"
      - "O contexto do trace se perde entre os dois serviços na cadeia"
      - "A correlação: painel genérico e consulta entre stacks param de servir"
      - "O Collector rejeita os spans cujos atributos não estejam registrados"
    answer: 2
    explanation: "O dado deixa de ser comparável. Semantic conventions são aborrecidas e são o que permite um painel de RED servir para qualquer serviço, e uma consulta TraceQL atravessar Java e Go sem tradução."
  - question: "Num fluxo assíncrono via Kafka, onde viaja o contexto do trace?"
    options:
      - "No corpo da mensagem, num campo reservado do schema do evento"
      - "Num tópico separado de metadados, correlacionado por chave"
      - "Não viaja: em fluxo assíncrono o trace necessariamente se parte"
      - "Nos headers da mensagem, propagados pelo produtor"
    answer: 3
    explanation: "Sem propagar nos headers, o consumidor abre um trace novo e a cadeia se parte exatamente no ponto mais difícil de investigar. O consumo se liga ao produtor por span link."
  - question: "Por que colocar tenant_id em baggage é útil e perigoso ao mesmo tempo?"
    options:
      - "Porque ele fica disponível na cadeia toda e vira atributo em todo lugar"
      - "Porque o header de baggage estoura o limite de tamanho de alguns proxies"
      - "Porque o baggage não é propagado por HTTP, só dentro do mesmo processo"
      - "Porque o baggage só é preservado nos traces efetivamente amostrados"
    answer: 0
    explanation: "Vem com o custo de cardinalidade e o risco de vazar PII. Baggage é lido por qualquer serviço adiante: nunca ponha dado sensível ali — ele se espalha por toda a telemetria e depois é praticamente impossível de remover."

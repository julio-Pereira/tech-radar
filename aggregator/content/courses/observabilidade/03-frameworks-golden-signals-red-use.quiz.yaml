questions:
  - question: "Sua taxa de erro subiu e o p99 melhorou. O que provavelmente aconteceu?"
    options:
      - "O cache aqueceu e passou a servir a maior parte das requisições"
      - "O autoscaler adicionou réplicas e distribuiu melhor a carga"
      - "A latência de erro entra no mesmo histograma e erros são rápidos"
      - "O sistema se recuperou sozinho ao reciclar as conexões do pool"
    answer: 2
    explanation: "Um 500 por conexão recusada volta em 2ms e puxa o percentil para baixo. Num histograma único, uma tempestade de erros melhora o p99 no exato momento em que o sistema está pior — e já foi lido em reunião como 'a latência normalizou'."
  - question: "Qual a diferença entre o pool a 100% de utilização com 3 threads na fila e com 300?"
    options:
      - "Enorme: utilização satura em 100% e a fila, que dói, não tem teto"
      - "Nenhuma: os dois casos descrevem um pool igualmente saturado"
      - "Apenas o consumo de memória das threads bloqueadas é diferente"
      - "A primeira é pior, porque há menos trabalho pronto para executar"
    answer: 0
    explanation: "É a lição do USE: utilization satura em 100% e não expressa 'quão pior está ficando'; saturation não satura. Por isso a saturação é o único sinal que avisa antes do incidente."
  - question: "Por que alertar por saturação de CPU é ruim, mas medir saturação de CPU é essencial?"
    options:
      - "Porque a métrica é cara de coletar e barata de consultar depois"
      - "Porque a CPU nunca satura de fato em ambientes com cgroups"
      - "Porque apenas a pressão de memória produz impacto visível ao usuário"
      - "Porque alerta é por sintoma, e a saturação é causa que explica"
    answer: 3
    explanation: "RED detecta, USE explica. O alerta de CPU dispara em batch noturno sem incidente e fica calado durante o incidente de I/O-bound; a saturação serve durante a investigação."
  - question: "Todos os endpoints retornam 200 e a conciliação contábil não fecha. Que sinal pega isso?"
    options:
      - "RED, pela taxa de erro observada nos endpoints do fluxo"
      - "Nenhum dos frameworks: eles medem transporte, não corretude"
      - "USE, pela saturação do pool de conexões com o banco de dados"
      - "Golden signals, porque a saturação antecede o erro de cálculo"
    answer: 1
    explanation: "Um sistema pode ter RED impecável e estar liquidando o valor errado. É preciso métrica de negócio e invariante: a soma dos lançamentos fechar em zero é o único sinal que pega erro de cálculo."

questions:
  - question: "Por que trace_id vai no conteúdo do log e não como label do Loki?"
    options:
      - "Porque labels do Loki não aceitam valores de string muito longos"
      - "Porque o formato do trace_id varia entre SDKs de linguagens diferentes"
      - "Porque cada valor distinto de label cria um stream, e a cardinalidade explode"
      - "Porque o LogQL só consegue filtrar pelo conteúdo, nunca por label"
    answer: 2
    explanation: "O Loki degrada como o Prometheus e herdou a mesma lição de cardinalidade. E a busca por trace_id no conteúdo continua rápida, porque a varredura já foi restringida pelos labels."
  - question: "O que o Loki indexa, e qual a consequência para a consulta?"
    options:
      - "Só os labels; o conteúdo é comprimido e varrido em paralelo depois"
      - "Todo o conteúdo das linhas, o que torna qualquer busca instantânea"
      - "Apenas o timestamp de cada linha, com o resto em armazenamento frio"
      - "O conteúdo completo, com atraso de alguns minutos para consolidar"
    answer: 0
    explanation: "Filtrar bem por label primeiro é o que dá desempenho. É a escolha de projeto que torna armazenamento e ingestão baratos, com o custo de exigir bons labels na consulta."
  - question: "Quando gerar métrica a partir de log com LogQL é aceitável?"
    options:
      - "Sempre, porque o LogQL é mais flexível que o PromQL do Prometheus"
      - "Nunca, porque o resultado não é comparável ao de uma métrica real"
      - "Apenas para contagem de erros, nunca para latência ou vazão"
      - "Para exploração e para o que é raro, nunca para painel permanente"
    answer: 3
    explanation: "O que virar painel fixo ou alerta deve virar uma métrica de verdade. Calcular métrica varrendo log é ordens de magnitude mais caro, e é uma armadilha de custo justamente porque funciona bem em pequena escala."
  - question: "Guardar a trilha de auditoria no Loki com 15 dias de retenção — qual o problema?"
    options:
      - "O Loki é lento demais para as consultas típicas de uma auditoria"
      - "Auditoria precisa ser completa, imutável e retida por anos"
      - "O LogQL não consegue consultar dados fora do período mais recente"
      - "Nenhum: é exatamente a prática recomendada pela documentação"
    answer: 1
    explanation: "O Loki é telemetria descartável, amostrável e de retenção curta. É um erro de categoria, e a pergunta que separa os dois é: se essa linha sumir, é um incômodo no debug ou um problema com o regulador?"

id: obs-agent-e-gateway
tipo: topologia
titulo: "O agent fica perto da app; só o gateway fala com o backend"
descricao: >
  Em cada nó do Kubernetes roda um Collector agent, como DaemonSet, que recebe a
  telemetria das aplicações daquele nó com um salto de rede curto. Ele enriquece os dados
  com os atributos k8s do pod, retira a PII o mais cedo possível e forma o primeiro lote.
  Os agents enviam para o Collector gateway, um Deployment escalável que faz o tail
  sampling, o roteamento e a agregação, e é o único que conversa com Tempo, Prometheus e
  Loki, reduzindo milhares de conexões a dezenas.
grupos:
  - { id: no1, rotulo: "nó 1", col: 0, row: 0, cols: 1, rows: 2 }
  - { id: no2, rotulo: "nó 2", col: 0, row: 2, cols: 1, rows: 2 }
nos:

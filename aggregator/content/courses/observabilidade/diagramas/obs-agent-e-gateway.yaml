  - { id: agent1, rotulo: "agent (DaemonSet)", grupo: no1, col: 0, row: 1 }
  - { id: app2, rotulo: "ledger-core", grupo: no2, col: 0, row: 2 }
  - { id: agent2, rotulo: "agent (DaemonSet)", grupo: no2, col: 0, row: 3 }
  - { id: gateway, rotulo: "gateway (Deployment)", col: 1, row: 2, papel: destaque }
  - { id: backends, rotulo: "Tempo, Prometheus, Loki", col: 2, row: 2, papel: externo }
arestas:

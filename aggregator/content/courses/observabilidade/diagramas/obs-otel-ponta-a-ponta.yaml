id: obs-otel-ponta-a-ponta
tipo: topologia
titulo: "A aplicação só conhece o OTLP; trocar de backend é trocar um exporter"
descricao: >
  O pix-gateway e o ledger-core são instrumentados com a API do OpenTelemetry, e o SDK
  de cada um amostra, agrupa e exporta pelo protocolo OTLP para o Collector. O Collector
  recebe, transforma e reexporta: traces para o Tempo, métricas para o Prometheus e logs
  para o Loki, todos consultados no Grafana. Nenhum serviço fala diretamente com um
  backend, então trocar o Tempo por outro armazenamento de traces muda um exporter no
  Collector, não o código das aplicações.

id: obs-pii-no-caminho
tipo: fluxo
titulo: "A PII é barrada no agente do nó, antes de sair da máquina"
descricao: >
  A primeira barreira é o serviço não emitir dado pessoal. A segunda é o Collector agent
  do nó, que apaga o Authorization, o e-mail e o texto das queries, troca o CPF por hash
  com sal e mascara CPF e PAN nos logs, antes de o dado trafegar pela rede. O gateway e os
  backends de telemetria recebem o dado já limpo e podem amostrá-lo. A trilha de
  auditoria segue outro caminho: completa, sem amostragem, imutável e retida por anos.
passos:
  - { id: servico, rotulo: "serviço: não emitir", col: 0, row: 0 }
  - { id: agent, rotulo: "agent: apaga, hash, máscara", col: 1, row: 0, papel: destaque }
  - { id: descartado, rotulo: "Authorization, e-mail", col: 1, row: 1 }
  - { id: gateway, rotulo: "gateway: tail sampling", col: 2, row: 0 }
  - { id: telemetria, rotulo: "Tempo / Loki (dias)", col: 3, row: 0 }
  - { id: auditoria, rotulo: "auditoria (anos, imutável)", col: 0, row: 1, papel: externo }
arestas:
  - { de: servico, para: agent, rotulo: "OTLP" }
  - { de: agent, para: descartado, rotulo: "delete", tipo: falha }
  - { de: agent, para: gateway, rotulo: "sem PII" }
  - { de: gateway, para: telemetria, rotulo: "amostrado" }
  - { de: servico, para: auditoria, rotulo: "completa, sem amostra" }

questions:
  - question: "Por que um alerta de \"taxa de erro acima de 1%\" erra nos dois sentidos?"
    options:
      - "Porque 1% já é um limiar alto demais para o contexto de uma fintech"
      - "Porque a taxa de erro é uma causa técnica, não um sintoma percebido"
      - "Porque grita num pico irrelevante e cala numa degradação de 0,5%"
      - "Porque depende de recording rules que ficam lentas durante o incidente"
    answer: 2
    explanation: "O pico de 30 segundos não consome budget relevante e a degradação lenta consome o mês inteiro. Limiar fixo não sabe nada sobre o orçamento; burn rate normaliza a velocidade de consumo pelo SLO."
  - question: "Para que serve o `and` com a janela curta no alerta de burn rate?"
    options:
      - "Para confirmar que a degradação ainda está acontecendo agora"
      - "Para reduzir o custo de avaliação da regra no servidor Prometheus"
      - "Para dar significância estatística ao número medido na janela longa"
      - "Para suprimir o disparo durante a janela de um deploy planejado"
    answer: 0
    explanation: "A janela longa demora a esfriar, e sem o `and` o alerta continua tocando depois que o incidente passou. A longa dá significância; a curta dá atualidade — é a diferença entre um sistema de alerta que o time confia e um que ele silencia."
  - question: "Um alerta disparou 40 vezes nos últimos 90 dias e nunca exigiu ação. O que fazer?"
    options:
      - "Elevar o limiar e mantê-lo ativo com a mesma severidade de hoje"
      - "Rebaixar para severidade média, mas continuar roteando para o pager"
      - "Manter como está, porque pode se tornar útil em algum incidente futuro"
      - "Deletar ou reescrever: ele é contribuição direta para o alert fatigue"
    answer: 3
    explanation: "Alert fatigue é a causa nº 1 de MTTA alto. Revisão periódica de alertas é o que quase ninguém faz, e a auditoria costuma remover mais da metade dos alertas de um time."
  - question: "Por que uma taxa de acionáveis abaixo de ~50% quebra o sistema de alerta inteiro?"
    options:
      - "Porque o Alertmanager passa a agrupar as notificações de forma errada"
      - "Porque o time passa a ignorar o pager, e aí nenhum alerta funciona"
      - "Porque a rotação de plantão fica pequena demais para o volume gerado"
      - "Porque o custo de armazenar o histórico de alertas cresce rápido demais"
    answer: 1
    explanation: "Inclusive o que importa, por melhor que esteja configurado. É uma propriedade do sistema humano, não do técnico — junto com acionamentos por turno, é a métrica que diz se o plantão é sustentável."

questions:
  - question: "Por que mitigar vem antes de diagnosticar?"
    options:
      - "Porque o diagnóstico depende de logs que só são gerados após mitigar"
      - "Porque a indisponibilidade custa dinheiro por minuto e a causa espera"
      - "Porque o regulador exige mitigação em menos de quinze minutos"
      - "Porque diagnosticar durante o incidente contamina a linha do tempo"
    answer: 1
    explanation: "Reverter o deploy ou trocar de PSP restaura o serviço agora; entender a causa fica para depois, com você descansado. É a parte contraintuitiva para engenheiro: a curiosidade sobre a causa raiz é legítima e cobra por minuto. Antes de tudo, inclusive da mitigação, vem avaliar o impacto."
  - question: "Todos os painéis estão verdes e o cliente reclama. Onde está o problema?"
    options:
      - "Numa métrica cuja cardinalidade explodiu e parou de ser coletada"
      - "No cliente, que provavelmente está com uma versão em cache antiga"
      - "Antes da sua instrumentação: DNS, certificado, balanceador, parceiro"
      - "Na janela de tempo selecionada nos painéis, que está deslocada"
    answer: 2
    explanation: "Continuar olhando métricas internas é olhar onde a luz está acesa. É a linha mais importante da árvore de decisão e a menos praticada — a ferramenta é a sonda sintética: se o tráfego não chega até você, seu SLI medido no servidor fica perfeito."
  - question: "Por que \"erro humano\" nunca é causa raiz num post-mortem?"
    options:
      - "Porque é onde a investigação começa, não onde ela termina"
      - "Porque a LGPD impede identificar pessoas em documentos internos"
      - "Porque erros humanos não são reprodutíveis em ambiente controlado"
      - "Porque o post-mortem trata apenas de causas de natureza técnica"
    answer: 0
    explanation: "Se uma pessoa conseguiu derrubar produção com um comando, a pergunta é por que o sistema permitiu. Blameless não é gentileza: onde há punição, ninguém escreve o que realmente aconteceu, e o documento vira ficção."
  - question: "Qual pergunta do post-mortem costuma gerar a melhor ação?"
    options:
      - "Quem executou o deploy que precedeu o início do incidente?"
      - "Qual foi o impacto financeiro total do período de indisponibilidade?"
      - "O runbook consultado durante o plantão estava atualizado?"
      - "Por que não foi detectado antes?"
    answer: 3
    explanation: "Se o MTTD foi de 40 minutos, o incidente durou 40 minutos a mais do que precisava, e melhorar detecção costuma ser mais barato que evitar a falha. As diferenças entre início real, detecção, mitigação e resolução são o dado mais acionável do documento inteiro."

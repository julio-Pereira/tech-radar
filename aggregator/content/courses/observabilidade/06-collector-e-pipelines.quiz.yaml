questions:
  - question: "Por que memory_limiter deve ser o primeiro processor e batch o último?"
    options:
      - "Porque o processor batch declara dependência explícita do memory_limiter"
      - "Porque o backpressure precisa vir antes de qualquer acúmulo de memória"
      - "Porque a ordem no YAML é apenas convenção de legibilidade do pipeline"
      - "Porque o Collector ordena os processors alfabeticamente ao carregar"
    answer: 1
    explanation: "E o batch agrupa depois de tudo já ter sido transformado. Collector morto por OOM derruba a telemetria de todo mundo exatamente durante o incidente que a gerou; descartar antes de morrer é a escolha certa."
  - question: "Por que head sampling é ruim para investigar incidente?"
    options:
      - "Porque consome mais CPU no SDK do que a alternativa por cauda"
      - "Porque não é compatível com exportação via protocolo OTLP puro"
      - "Porque quebra a propagação de contexto entre serviços da cadeia"
      - "Porque decide antes de saber o que aconteceu, de forma aleatória"
    answer: 3
    explanation: "O trace do erro tem a mesma chance de qualquer outro: com 10% de head sampling, aquele erro específico tem 10% de chance de existir. Tail sampling decide com o trace completo em mãos e guarda 100% dos erros."
  - question: "O que acontece com o tail sampling se os spans de um trace caírem em gateways diferentes?"
    options:
      - "Cada gateway decide sobre um trace parcial, e o erro é silencioso"
      - "Os gateways se coordenam por gossip e reconstroem o trace completo"
      - "O trace inteiro é descartado por não passar na validação de integridade"
      - "Nada muda, porque a decisão de amostragem é tomada span a span"
    answer: 0
    explanation: "Você perde parte dos traces que importam. É a razão nº 1 de o gateway existir como camada separada, com o loadbalancing exporter roteando por trace-id — a configuração parece certa e está perdendo justamente os erros."
  - question: "Por que se amostra trace e não métrica?"
    options:
      - "Porque o modelo de dados de métrica não suporta amostragem"
      - "Porque o Prometheus recusa séries marcadas como amostradas"
      - "Porque métrica já é agregada e barata; amostrar destruiria o sinal"
      - "Porque traces têm valor de investigação maior do que métricas"
    answer: 2
    explanation: "Métrica tem cardinalidade baixa por construção e é o que dispara o alerta. O trace é que é caro por guardar cada evento — e por isso é ele que se amostra."

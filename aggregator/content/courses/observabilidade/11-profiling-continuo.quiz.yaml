questions:
  - question: "Num flame graph, o que a largura de um bloco representa e o que a altura não representa?"
    options:
      - "Largura é o número de chamadas; altura é a memória alocada no caminho"
      - "As duas representam tempo, em escalas de resolução diferentes"
      - "Largura é a profundidade da pilha; altura é o tempo total gasto"
      - "Largura é tempo naquele caminho; altura é só aninhamento, não lentidão"
    answer: 3
    explanation: "Pilha alta e estreita é código aninhado e barato. Bloco largo no topo é onde a CPU está sendo gasta pela própria função."
  - question: "Por que o eixo horizontal de um flame graph não é uma linha do tempo?"
    options:
      - "Porque é uma agregação ordenada alfabeticamente para agrupar caminhos"
      - "Porque o profile é amostrado e as amostras não cobrem todo o intervalo"
      - "Porque a dimensão temporal é representada no eixo vertical do gráfico"
      - "Porque as amostras chegam fora de ordem e são reordenadas na ingestão"
    answer: 0
    explanation: "Ler o eixo horizontal como cronologia é o erro nº 1 de interpretação. Nada ali indica que uma função rodou antes da outra."
  - question: "O trace mostra 800ms num span e os spans filhos somam 200ms. Qual sinal você abre?"
    options:
      - "Os logs daquele serviço no período exato do span mais lento"
      - "As métricas de saturação do nó onde o pod estava executando"
      - "O profile do pod e do período, que responde 'por quê, em qual linha'"
      - "O service graph, para ver se a dependência mudou de comportamento"
    answer: 2
    explanation: "Os 600ms estão fora do instrumentado. Serialização, regex em laço ou GC não têm span próprio, e só aparecem no profile."
  - question: "Qual a vantagem do profiling por eBPF e qual o custo num cluster com Pod Security restricted?"
    options:
      - "É mais preciso que o SDK e não impõe custo operacional relevante"
      - "Funciona apenas com binários Go, mas dispensa exceções de segurança"
      - "Reduz o overhead a zero e exige apenas uma annotation no Deployment"
      - "Perfila sem instrumentar, mas exige um DaemonSet privilegiado"
    answer: 3
    explanation: "Sem SDK, sem recompilar, funcionando até para binários de terceiros — mas com kernel recente e uma exceção de segurança que precisa ser justificada. O outro custo é precisão de símbolos em algumas linguagens."

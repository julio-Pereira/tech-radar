questions:
  - question: "Todos os endpoints retornam 200, a latência está ótima e a receita do dia caiu 30%. Que sinal pega isso?"
    options:
      - "A saturação dos pools, que antecede qualquer queda de conversão"
      - "O profiling contínuo dos serviços do caminho de pagamento"
      - "Métrica de negócio: a taxa de autorização, que RED e USE não cobrem"
      - "Os logs de erro dos serviços que conversam com os parceiros"
    answer: 2
    explanation: "RED e USE medem transporte, não conteúdo. Um PSP respondendo 200 com recusa é, do ponto de vista de HTTP, sucesso — e métrica de negócio costuma ser a primeira a detectar os incidentes mais caros."
  - question: "Por que account_id não pode ser label de uma métrica de negócio?"
    options:
      - "Porque cria uma série por conta e a cardinalidade mata o Prometheus"
      - "Porque a LGPD proíbe qualquer identificador de titular em telemetria"
      - "Porque labels do Prometheus só aceitam valores de tipo numérico"
      - "Porque o Grafana não consegue renderizar séries em número tão alto"
    answer: 0
    explanation: "Métrica de negócio é agregada por natureza, e a explosão de cardinalidade derruba o Prometheus por OOM. O caso individual pertence a log e trace, onde a alta cardinalidade cabe."
  - question: "Por que a taxa de autorização é mais útil quebrada por PSP?"
    options:
      - "Porque reduz a cardinalidade total da métrica no servidor"
      - "Porque o SLA contratado é definido individualmente com cada PSP"
      - "Porque facilita o cálculo do TPV consolidado do dia"
      - "Porque transforma 'algo está errado' em 'é o parceiro X' em segundos"
    answer: 3
    explanation: "psp tem cardinalidade baixa (poucos valores) e altíssimo valor diagnóstico — é o recorte que responde 'é o Itaú ou é a gente?'."
  - question: "Qual alerta de negócio nunca tem falso positivo aceitável?"
    options:
      - "Queda percentual do TPV em relação à mesma hora da semana anterior"
      - "Invariante contábil violada: a soma dos lançamentos não fecha em zero"
      - "Taxa de autorização abaixo da média móvel dos últimos sete dias"
      - "Fila de liquidação crescendo por mais de quinze minutos seguidos"
    answer: 1
    explanation: "Os outros dependem de sazonalidade e contexto. Uma invariante violada significa que a contabilidade está errada, e é o tipo de alerta que quase nenhuma empresa tem."

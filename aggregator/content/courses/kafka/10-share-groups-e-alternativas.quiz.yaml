questions:
  - question: "O que um share group permite que um consumer group tradicional não permite?"
    options:
      - "Vários consumidores na mesma partição, com ack por registro"
      - "Ordem total garantida entre todas as partições do tópico"
      - "Retenção independente por consumidor no mesmo tópico"
      - "Replicação automática das mensagens entre clusters"
    answer: 0
    explanation: "É semântica de fila com o log por baixo: o paralelismo deixa de ter teto no número de partições. O preço é a ordem, e é por isso que ele serve para tarefa sem ordem, não para o caminho do dinheiro."
  - question: "Uma tarefa de geração de PDF leva 30 segundos e o volume é irregular. Por que um tópico particionado é a escolha ruim?"
    options:
      - "Porque o payload do PDF ultrapassa o limite de tamanho da mensagem"
      - "Porque a retenção padrão do tópico expira antes de o worker terminar a tarefa"
      - "Porque a tarefa de 30s bloqueia a fila da partição e o paralelismo tem teto"
      - "Porque o Kafka não confirma entrega em processamentos longos"
    answer: 2
    explanation: "Ordem é exatamente o que você não quer aqui, e é o que está te custando o paralelismo. Share group ou SQS resolvem com ack individual e workers independentes."
  - question: "Qual a limitação mais importante do RabbitMQ e do SQS em relação ao Kafka?"
    options:
      - "O teto de vazão fica em alguns milhares de mensagens por segundo"
      - "Não oferecem fila de mensagens mortas para o que falha repetidamente no consumo"
      - "Não confirmam a entrega da mensagem ao consumidor"
      - "A mensagem some ao ser confirmada: não há replay nem consumidores independentes"
    answer: 3
    explanation: "É a diferença estrutural entre fila e log. Se você precisa reprocessar o histórico ou tem três consumidores independentes do mesmo evento, a fila não serve."
  - question: "Quando escolher Flink em vez de Kafka Streams?"
    options:
      - "Quando a equipe já domina Java e quer reaproveitar o ferramental"
      - "Quando um requisito concreto exigir: várias fontes e destinos, escala ou semântica de tempo"
      - "Quando o volume do tópico ultrapassar mil mensagens por segundo"
      - "Quando o processamento precisar de garantia exactly-once ponta a ponta entre os tópicos"
    answer: 1
    explanation: "Streams não tem cluster para operar; Flink tem. Escolher Flink por ser mais poderoso é adquirir uma especialidade e um cluster sem requisito que os justifique."

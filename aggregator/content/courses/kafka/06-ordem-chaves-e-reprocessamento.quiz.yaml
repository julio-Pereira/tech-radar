questions:
  - question: "Você aumenta um tópico de 6 para 12 partições. O que acontece com a ordem por conta?"
    options:
      - "Nada, o Kafka remapeia as chaves preservando a ordem"
      - "Quebra somente para chaves que ainda não existiam"
      - "Nada, desde que o producer esteja com acks=all"
      - "Quebra, porque hash(chave) % partições muda"
    answer: 3
    explanation: "O módulo muda com o número de partições, e por um período há eventos da mesma conta em duas partições. Aumentar partição num tópico com ordem por chave não é operação de escala, é migração."
  - question: "Lag alto numa única partição e praticamente zero nas outras. Qual o diagnóstico mais provável?"
    options:
      - "Disco cheio no broker líder daquela partição"
      - "Partição quente: uma chave concentra o volume"
      - "Rebalance do grupo ainda em andamento"
      - "min.insync.replicas configurado acima do RF"
    answer: 1
    explanation: "Uma partição tem um consumidor. Se um cliente é 30% do volume, aquela partição é 30% da carga e nenhum número de consumidores resolve — é por isso que se observa lag por partição, não o total."
  - question: "Um estorno chega antes do débito correspondente. Qual o comportamento correto do ledger?"
    options:
      - "Aceitar em estado pendente e resolver quando o par chegar"
      - "Rejeitar, já que não existe lançamento a estornar"
      - "Descartar em silêncio e aguardar que o PSP reenvie o par"
      - "Reordenar os eventos no tópico antes de processar"
    answer: 0
    explanation: "Evento fora de ordem é normal, não é bug — o estorno pode ter vindo de outro canal, com atraso diferente. Rejeitar é perder dinheiro do cliente; reordenar o tópico não é uma operação que exista."
  - question: "Qual é o pré-requisito antes de rodar kafka-consumer-groups --reset-offsets --execute?"
    options:
      - "Aumentar a retenção do tópico antes de iniciar o replay"
      - "Desligar a compactação enquanto o reset roda"
      - "Parar o grupo, rodar --dry-run e ter consumidor idempotente"
      - "Reduzir o número de partições para simplificar a operação"
    answer: 2
    explanation: "O grupo parado é uma proteção do próprio comando, que falha com membro ativo. O --dry-run mostra o efeito, e a idempotência é o que torna o replay seguro — sem ela, reset de offset é decisão de reexecutar efeitos."

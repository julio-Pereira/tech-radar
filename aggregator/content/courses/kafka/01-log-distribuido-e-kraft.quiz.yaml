questions:
  - question: "Você consome um tópico com --group teste, e ao rodar o mesmo comando de novo nada aparece. Onde ficou guardada a posição de leitura?"
    options:
      - "No tópico interno `__consumer_offsets`"
      - "Num arquivo de estado local do cliente"
      - "No ZooKeeper, junto com os metadados"
      - "Em memória do broker, perdida no restart"
    answer: 0
    explanation: "O offset do grupo é commitado num tópico interno do próprio Kafka. Sem --group, o console consumer não pertence a grupo nenhum e por isso relê do começo quando você pede --from-beginning."
  - question: "Qual é a diferença estrutural entre um log append-only e uma fila tradicional?"
    options:
      - "O log é mais rápido porque serve tudo da memória"
      - "O log garante ordem global entre todas as mensagens"
      - "A fila não aceita múltiplos produtores simultâneos"
      - "A mensagem não some ao ser lida; a posição é do consumidor"
    answer: 3
    explanation: "Leitura não destrói. Daí saem replay, múltiplos consumidores independentes e auditoria natural — e daí sai também a responsabilidade pelo offset, que é onde nascem duplicidade e perda."
  - question: "O que o KRaft mudou em relação à série 3.x com ZooKeeper?"
    options:
      - "As mensagens passaram a ser replicadas por Raft"
      - "Os metadados vivem no Kafka, replicados entre controllers"
      - "O cluster deixou de precisar de replicação de partição"
      - "Os offsets passaram a ser mantidos pelo cliente"
    answer: 1
    explanation: "KRaft move os metadados (tópicos, líderes, ACLs) para um log interno mantido por nós controllers. Um sistema a menos para operar e failover de metadados mais rápido. O ZooKeeper foi removido na série 4.x."
  - question: "Em qual destes casos o Kafka é a ferramenta errada?"
    options:
      - "Vários consumidores independentes leem o mesmo fluxo"
      - "É preciso reprocessar o histórico de ontem após um bug"
      - "O produtor aguarda resposta num tópico de retorno"
      - "É preciso ordem por conta em movimentações financeiras"
    answer: 2
    explanation: "Isso é RPC síncrono disfarçado: caro, frágil e com latência pior que uma chamada direta. Se você não precisa de múltiplos consumidores, ordem e replay, provavelmente não é Kafka."

questions:
  - question: "Por que inverter a ordem (publicar no Kafka antes de salvar no banco) não resolve o dual-write?"
    options:
      - "Resolve, desde que o producer use acks=all"
      - "Não resolve: um rollback no banco deixa evento órfão"
      - "Resolve, porque o Kafka é mais confiável que o banco"
      - "Não resolve, porque o Kafka não implementa rollback"
    answer: 1
    explanation: "Você só troca qual das duas inconsistências vai ter: em vez de pagamento sem evento, um evento de um pagamento que não existe. O problema é estrutural — não há commit atômico entre dois sistemas."
  - question: "Qual é o modo de falha característico do CDC que derruba o banco de produção?"
    options:
      - "O conector satura a CPU do banco ao ler o log"
      - "O conector bloqueia as tabelas durante a leitura"
      - "O binlog é reescrito pelo conector ao confirmar"
      - "Slot de replicação parado faz o WAL encher o disco"
    answer: 3
    explanation: "Enquanto o slot não confirma consumo, o banco precisa reter o log de replicação. Conector parado por horas vira disco cheio — e o que cai é o banco, não o conector."
  - question: "Por que fazer retry com Thread.sleep dentro do próprio consumidor provoca rebalance?"
    options:
      - "Porque bloquear entre polls estoura max.poll.interval.ms"
      - "Porque o sleep desconecta o cliente do broker"
      - "Porque o sleep zera o offset commitado do grupo"
      - "Porque o Kafka proíbe threads bloqueadas no consumo"
    answer: 0
    explanation: "O poll é o que mantém a sessão viva, e o broker considera morto quem não volta a tempo. Retry escalonado em tópicos separados existe justamente para o consumidor principal nunca bloquear."
  - question: "Uma DLQ com 4.000 mensagens acumuladas há três meses indica o quê?"
    options:
      - "Que a DLQ está funcionando exatamente como projetada"
      - "Que a retenção configurada na DLQ está alta demais"
      - "Que são 4.000 operações de negócio que não aconteceram"
      - "Que o retry escalonado está mal dimensionado"
    answer: 2
    explanation: "Cada mensagem ali é um pagamento que não foi processado, e ninguém percebeu. DLQ é incidente, não estatística: precisa de dono, alerta na primeira mensagem e um caminho de reprocessamento testado."
  - question: "Uma saga compensa um pagamento que falhou no antifraude. O que o cliente vê no extrato?"
    options:
      - "Nada, porque a compensação apaga o lançamento original"
      - "Somente o estorno, com a reserva suprimida"
      - "Um único lançamento com valor líquido zero"
      - "Dois lançamentos: a reserva e o estorno"
    answer: 3
    explanation: "Em contabilidade double-entry lançamento não se apaga: compensação é transação nova, não rollback. Tentar esconder a reserva quebra a conciliação contábil, e o cliente vai perguntar pelos dois de qualquer forma."

questions:
  - question: "Por que alertar por \"lag acima de 10.000\" erra nos dois sentidos?"
    options:
      - "Porque a métrica de lag não é confiável em consumidores Java"
      - "Porque o lag só é exposto por partição, e nunca no total do grupo"
      - "Porque o limiar fixo ignora a taxa de consumo do grupo"
      - "Porque o lag fica alto logo após todo rebalance, sem significar problema"
    answer: 2
    explanation: "Ele grita no pico legítimo de fim de mês e fica calado num consumidor lento de baixo volume. Alerte pela derivada (lag crescendo há N minutos) e pelo tempo estimado de recuperação (lag ÷ taxa) — o número que responde \"vamos furar o SLA?\"."
  - question: "`UnderReplicatedPartitions` está diferente de zero. O que isso significa?"
    options:
      - "Que o cluster está rebalanceando partições, o que é esperado"
      - "Que réplicas ficaram para trás do líder e a margem de durabilidade caiu"
      - "Que há partições sem líder eleito e o tópico já está indisponível para escrita"
      - "Que o RF configurado excede o número de brokers do cluster"
    answer: 1
    explanation: "Uma queda a mais pode furar o `min.insync.replicas` e parar a escrita. É o alerta mais importante do cluster; indisponibilidade explícita é o `OfflinePartitionsCount`, e os dois devem ser zero."
  - question: "Por que a heap do broker deve ser modesta, mesmo numa máquina com muita RAM?"
    options:
      - "Porque o KRaft impõe um teto de 6GB para a heap do broker"
      - "Porque uma heap grande aumenta a latência de cada fsync no log"
      - "Porque a JVM do broker não consegue endereçar mais de 4GB"
      - "Porque o Kafka serve os dados pelo page cache do SO, não pela heap"
    answer: 3
    explanation: "RAM sobrando é o que mantém os consumidores lendo da memória, e heap grande só alonga as pausas de GC. Pausa longa tira o broker do ISR e provoca eleição de líder — \"o broker tem só 6GB de heap\" não significa que a máquina deva ter 8GB."
  - question: "Um requisito chega escrito como \"os eventos precisam ser processados na ordem\". Qual pergunta você faz antes de aceitar?"
    options:
      - "Quantas mensagens por segundo esse fluxo precisa suportar no pico?"
      - "O consumidor desse fluxo já é idempotente hoje?"
      - "Ordem entre o quê e o quê, exatamente?"
      - "Podemos assumir `acks=all` no producer desse tópico?"
    answer: 2
    explanation: "Quase sempre o requisito real é ordem por entidade, não ordem global. Ordem global custa uma partição e um consumidor, sem escala; ordem por chave dá a mesma garantia onde ela importa e mantém o paralelismo."

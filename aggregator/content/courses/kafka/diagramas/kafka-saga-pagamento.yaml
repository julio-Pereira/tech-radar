id: kafka-saga-pagamento
tipo: fluxo
titulo: "A saga compensa em ordem inversa, com transações novas, não com rollback"
descricao: >
  A saga divide o pagamento em três passos locais: reservar o saldo, autorizar no PSP e
  lançar no ledger. Não há transação entre eles. Se o PSP recusa a autorização, a única
  compensação é liberar a reserva. Se o lançamento no ledger falha depois de o PSP
  autorizar, a saga desfaz todos os passos concluídos, em ordem inversa: primeiro cancela
  a autorização no PSP, depois libera a reserva. Cada compensação é uma transação nova,
  com data própria e visível no extrato, e cada passo tem prazo, para nenhuma saga ficar
  pendurada com o saldo do cliente reservado.
passos:
  - { id: reservar, rotulo: "reservar saldo", col: 0, row: 0 }
  - { id: autorizar, rotulo: "autorizar no PSP", col: 1, row: 0, papel: externo }
  - { id: lancar, rotulo: "lançar no ledger", col: 2, row: 0, papel: destaque }
  - { id: liberar, rotulo: "liberar reserva", col: 0, row: 1 }
  - { id: cancelar, rotulo: "cancelar autorização", col: 1, row: 1, papel: externo }
arestas:
  - { de: reservar, para: autorizar }
  - { de: autorizar, para: lancar, rotulo: "autorizado" }
  - { de: autorizar, para: liberar, rotulo: "recusou", tipo: falha }
  - { de: lancar, para: cancelar, rotulo: "falhou", tipo: falha }
  - { de: cancelar, para: liberar, rotulo: "depois", tipo: compensacao }
animacao:
  - legenda: "A saga tem três passos locais, sem transação entre eles"
  - legenda: "Saldo reservado; a saga pede a autorização ao PSP"
    estados: { reservar: ativo }
    fluxos: [ { de: reservar, para: autorizar } ]
  - legenda: "PSP autorizou; a saga lança o pagamento no ledger"
    estados: { autorizar: ativo }
    fluxos: [ { de: autorizar, para: lancar } ]
  - legenda: "O lançamento no ledger falha depois de o PSP autorizar"
    estados: { lancar: falha }
  - legenda: "Compensação em ordem inversa: primeiro cancela a autorização no PSP"
    estados: { cancelar: ativo, autorizar: inativo }
    fluxos: [ { de: lancar, para: cancelar } ]
  - legenda: "Depois libera a reserva: cada compensação é uma transação nova"
    estados: { liberar: ativo, reservar: inativo }
    fluxos: [ { de: cancelar, para: liberar } ]
    anotacao: "nada é apagado: o extrato mostra os lançamentos"

questions:
  - question: "Por que não existe comando para diminuir o número de partições de um tópico?"
    options:
      - "Porque não há para onde mandar as mensagens sem quebrar offset e ordem"
      - "Porque a operação exigiria reduzir para RF=1 temporariamente em todo o tópico"
      - "Porque o KRaft removeu essa operação a partir da série 4.x"
      - "Existe, mas só pode ser executada com o cluster parado"
    answer: 0
    explanation: "Aumentar é uma chamada de API (que já quebra a ordem por chave). Diminuir não tem resposta boa: o caminho é tópico novo e migração. Partição é a decisão de dimensionamento difícil de desfazer."
  - question: "Você tem RF=3 e acha que sobrevive à perda de uma zona de disponibilidade. O que `broker.rack` acrescenta?"
    options:
      - "Nada, porque RF=3 já espalha as réplicas entre zonas distintas"
      - "Ele eleva o fator de replicação automaticamente quando uma zona fica indisponível"
      - "Ele reduz a latência de replicação escolhendo réplicas próximas"
      - "Ele distribui as réplicas entre AZs, sem o que as três podem ficar juntas"
    answer: 3
    explanation: "RF=3 é uma contagem, não uma topologia. Rack awareness é o que transforma o número em garantia real contra a perda de uma zona."
  - question: "No failover para o cluster de DR, por que o consumidor não pode simplesmente reusar o offset que tinha na origem?"
    options:
      - "Porque o MirrorMaker replica apenas configurações, não mensagens"
      - "Porque os offsets não coincidem entre clusters: a replicação começou depois"
      - "Porque os offsets do grupo expiram durante a janela de failover"
      - "Porque o cluster de destino grava os offsets do grupo em outro formato binário"
    answer: 1
    explanation: "O MirrorMaker 2 mantém checkpoints que traduzem de um cluster para o outro. Plano de failover que ignora esse mapeamento reprocessa ou pula horas de eventos — e num ledger os dois são incidente."
  - question: "Numa replicação assíncrona, qual é o seu RPO real?"
    options:
      - "O valor de RPO contratado e registrado no documento de DR"
      - "Zero, porque o MirrorMaker replica de forma contínua"
      - "O lag do MirrorMaker no instante da queda"
      - "O intervalo configurado entre os backups do cluster"
    answer: 2
    explanation: "O RPO é o que você perde, e o que você perde é exatamente o que ainda não tinha sido replicado. Meça o lag continuamente, com painel e alerta; o número do documento é uma intenção."

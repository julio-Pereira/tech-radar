questions:
  - question: "Com compatibilidade BACKWARD, qual é a ordem correta de deploy?"
    options:
      - "Producers primeiro, depois consumidores"
      - "Consumidores primeiro, depois producers"
      - "Tanto faz"
      - "Simultâneo, com janela de manutenção"
    answer: 1
    explanation: "BACKWARD significa que o consumidor novo lê dado velho. Você atualiza os consumidores, que passam a entender os dois formatos, e só então os producers começam a emitir o formato novo. FORWARD inverte a ordem."
  - question: "Por que adicionar um campo obrigatório novo quebra o consumidor horas depois do deploy?"
    options:
      - "Porque o Schema Registry demora a propagar"
      - "Porque o consumo é assíncrono: a quebra só aparece quando aquele consumidor processa uma mensagem no formato novo"
      - "Porque o cache de schema expira em horas"
      - "Porque o broker valida schemas em background"
    answer: 1
    explanation: "Diferente de uma API síncrona, onde a quebra é imediata e óbvia, aqui a falha aparece longe da causa — o que torna a correlação difícil justamente quando você mais precisa dela."
  - question: "Como representar dinheiro num evento?"
    options:
      - "float64, que é suficiente para valores em reais"
      - "Inteiro na menor unidade com moeda e escala explícitas, ou string decimal"
      - "String formatada como 'R$ 150,75'"
      - "Dois campos: parte inteira e centavos, ambos int"
    answer: 1
    explanation: "Ponto flutuante binário não representa 0,1 exatamente, e o erro acumulado em milhões de lançamentos quebra a conciliação. Inteiro em centavos com currency e scale, ou string decimal quando a escala varia."
  - question: "Você precisa mudar o schema de um tópico e não sabe quem o consome. O que fazer primeiro?"
    options:
      - "Publicar a mudança e esperar reclamações"
      - "Consultar os consumer groups ativos do tópico e o catálogo de eventos, e usar compatibilidade FULL enquanto isso"
      - "Criar um tópico novo e abandonar o antigo"
      - "Mudar com compatibilidade NONE, que é mais rápido"
    answer: 1
    explanation: "kafka-consumer-groups --list mostra quem lê hoje. FULL garante que a mudança não quebra nem consumidor velho nem novo, o que compra tempo para descobrir e coordenar."

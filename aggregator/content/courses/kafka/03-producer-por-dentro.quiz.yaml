questions:
  - question: "Você habilitou enable.idempotence=true no producer. Se a sua API HTTP reprocessar a mesma requisição de pagamento, o evento aparece duplicado no tópico?"
    options:
      - "Não, a idempotência deduplica pelo conteúdo da mensagem"
      - "Não, o broker deduplica pela chave da mensagem"
      - "Depende do valor configurado em acks"
      - "Sim, ela só cobre o retry interno do producer"
    answer: 3
    explanation: "A idempotência do producer numera as mensagens por sessão e partição para descartar o retry interno. Dois send() distintos da aplicação são dois eventos legítimos do ponto de vista do Kafka — idempotência de negócio mora na chave de idempotência no banco."
  - question: "Sem enable.idempotence, por que max.in.flight.requests.per.connection > 1 combinado com retry pode reordenar mensagens?"
    options:
      - "Porque o lote 2 pode ser gravado enquanto o lote 1 é reenviado"
      - "Porque o particionador escolhe outra partição no retry"
      - "Porque o broker reordena os lotes por timestamp"
      - "Porque o acumulador embaralha os lotes ao comprimir"
    answer: 0
    explanation: "Com vários lotes em voo, uma falha no primeiro faz o producer reenviá-lo depois que o segundo já entrou no log. Com idempotência ligada o broker usa a numeração para reordenar, e por isso max.in.flight<=5 continua seguro."
  - question: "Numa fintech que precisa ordenar débito e estorno da mesma conta, qual chave você usa e o que perde?"
    options:
      - "paymentId, que distribui bem e mantém a ordem por conta"
      - "Nenhuma chave, porque o Kafka ordena por timestamp"
      - "accountId, ao custo de risco de partição quente"
      - "agencia, pelo equilíbrio entre ordem e paralelismo"
    answer: 2
    explanation: "Ordem existe por partição. accountId põe todos os eventos da conta na mesma partição, ordenando débito e estorno. O custo é que um cliente muito grande vira uma partição quente, que nenhum número de consumidores resolve."
  - question: "Qual é o efeito mais provável de subir linger.ms de 0 para 20 num producer com bom volume?"
    options:
      - "p50 e p99 pioram na mesma proporção"
      - "p50 sobe alguns ms e o p99 frequentemente melhora"
      - "Nada muda, porque linger.ms é do consumidor"
      - "O throughput cai, já que cada mensagem espera mais"
    answer: 1
    explanation: "O linger junta mais mensagens por lote: menos requisições, melhor compressão e broker menos sobrecarregado. Você paga alguns ms no p50 e costuma ganhar no p99, que é dominado pela fila no broker."
  - question: "O que acontece com um erro de envio se você chamar send() e ignorar o Future/callback?"
    options:
      - "O send() lança exceção e o try/catch em volta pega"
      - "O Kafka reenvia indefinidamente até a mensagem passar"
      - "A mensagem é roteada para a DLQ automaticamente"
      - "O erro se perde: o send() apenas enfileira e retorna"
    answer: 3
    explanation: "send() coloca a mensagem no acumulador e volta na hora; broker fora do ar, tópico inexistente ou mensagem grande demais chegam depois, pelo callback. Ignorá-lo é aceitar perder pagamento sem rastro."

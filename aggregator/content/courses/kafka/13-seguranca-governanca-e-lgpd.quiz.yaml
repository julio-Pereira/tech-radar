questions:
  - question: "Por que tombstone + compaction não resolve sozinho um pedido de eliminação da LGPD?"
    options:
      - "Porque o tombstone não é reconhecido por consumidores fora do ecossistema Java"
      - "Porque a compaction reescreve os offsets e invalida os grupos existentes"
      - "Porque apaga só o registro daquela chave, e o CPF segue em outros eventos"
      - "Porque o mecanismo exige RF=1 no tópico durante a limpeza"
    answer: 2
    explanation: "É a solução ingênua mais comum. Além de valer só em tópico compactado e de ser assíncrona, ela cobre um caso estreito e deixa o dado pessoal espalhado pelos eventos de outras chaves."
  - question: "O que o crypto-shredding preserva que a reescrita do tópico destrói?"
    options:
      - "O throughput do produtor durante a operação de expurgo"
      - "A integridade do log: offsets e payload bruto seguem idênticos"
      - "A compatibilidade dos schemas já registrados no Schema Registry"
      - "A política de retenção configurada originalmente no tópico"
    answer: 1
    explanation: "Só o conteúdo pessoal vira bytes irrecuperáveis. É o que reconcilia as duas obrigações: o registro contábil permanece para o regulador, e o dado pessoal deixa de ser recuperável para a LGPD. O custo é gerir uma chave por titular."
  - question: "Por que minimizar PII no evento é mais eficaz que criptografá-la?"
    options:
      - "Porque a criptografia moderna é lenta demais para o caminho crítico do pagamento"
      - "Porque a LGPD não aceita criptografia como medida técnica de proteção"
      - "Porque cifrar o campo quebra a compactação por chave do tópico"
      - "Porque o dado ausente não vaza na DLQ, no data lake, no log nem no trace"
    answer: 3
    explanation: "Criptografia protege o campo onde ele está; minimização remove o problema de todos os lugares por onde o dado passaria. E boa parte dos campos está no evento só porque alguém copiou o objeto de domínio inteiro."
  - question: "Qual é o risco concreto de manter `allow.everyone.if.no.acl.found=true`?"
    options:
      - "Todo recurso sem ACL criada fica aberto para qualquer principal"
      - "As ACLs já existentes deixam de ser avaliadas pelo authorizer"
      - "O cluster passa a rejeitar conexões que não apresentem certificado"
      - "O authorizer para de registrar as decisões de autorização no log"
    answer: 0
    explanation: "'Esqueci de criar a ACL' vira 'qualquer um pode ler o tópico de pagamentos'. Numa fintech isso fica `false`, e a consequência — toda integração nova precisa de ACL explícita — é o comportamento desejado, não um incômodo."

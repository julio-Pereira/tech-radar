id: sd-wt-falha
tipo: topologia
titulo: "No teste, o Toxiproxy fica entre o pix-gateway e o fake do SPI"
descricao: >
  O cliente pede o Pix ao pix-gateway, que valida, reserva no ledger e envia a ordem ao SPI.
  No laboratório do marco, o SPI é um fake, e toda conversa com ele passa pelo Toxiproxy, que
  injeta latência, derruba conexões ou corrompe respostas. O fake do SPI registra o que liquidou
  no arquivo de liquidação do dia. A conciliação D+1 lê esse arquivo, resolve no ledger os
  pagamentos que ficaram em verificação, e o ledger devolve o estado terminal ao pix-gateway, que
  notifica o cliente.

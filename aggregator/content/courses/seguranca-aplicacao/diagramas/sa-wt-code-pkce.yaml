id: sa-wt-code-pkce
tipo: topologia
titulo: "O navegador só carrega o code; os tokens andam por back-channel"
descricao: >
  O titular usa o navegador, que vai e volta entre o pix-gateway, no papel de client, e o
  fin-idp, o authorization server: é o front-channel, por onde passam só o redirect, o code e o
  state. A troca do code pelos tokens e a renovação com o refresh token acontecem por
  back-channel, direto entre o client e o fin-idp. A API de pagamentos, no papel de resource
  server, recebe o access_token e valida a assinatura com as chaves públicas do JWKS do fin-idp.
  Um atacante com um refresh token roubado também fala direto com o fin-idp.

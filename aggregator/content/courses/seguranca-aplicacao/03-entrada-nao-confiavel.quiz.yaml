questions:
  - question: "Um endpoint de estorno usa `@NotNull` e `@Positive` no campo de valor, mas ainda assim aceita um estorno maior do que o valor da transação original. Por que a anotação de borda não pegou esse caso?"
    options:
      - "Porque `@Positive` só valida números de ponto flutuante, e o campo provavelmente é do tipo `BigDecimal`"
      - "Porque a anotação de borda valida o formato do valor recebido, não a invariante de negócio que relaciona esse valor a outro dado do sistema"
      - "Porque validações Bean Validation só são executadas em ambiente de desenvolvimento, não em produção"
      - "Porque o valor do estorno deveria ter sido validado no banco de dados via constraint, não na camada de API"
    answer: 1
    explanation: "`@NotNull` e `@Positive` garantem que o valor existe e é positivo — formato, não sentido de negócio. A regra 'o estorno não pode exceder o valor original' depende de comparar com outro dado (a transação), o que é invariante de domínio, não validação de campo isolado."

  - question: "Por que query parametrizada é considerada uma defesa 'estrutural' contra SQL injection, e não apenas uma boa prática?"
    options:
      - "Porque ela criptografa o valor antes de enviá-lo ao banco de dados"
      - "Porque ela separa dado de código no nível do protocolo, tornando a interpretação do dado como comando estruturalmente impossível, não apenas improvável"
      - "Porque ela é obrigatória por padrão em todo driver JDBC moderno, sem exceção"
      - "Porque ela elimina a necessidade de qualquer validação de entrada na camada de aplicação"
    answer: 1
    explanation: "A diferença entre 'escapar caracteres' e parametrizar é que a segunda separa dado de comando no próprio protocolo de comunicação com o banco — o valor nunca é interpretado como parte da instrução SQL, independentemente do seu conteúdo. Escapar depende de cobrir todos os casos; parametrizar remove a classe de erro inteira."

  - question: "Uma aplicação valida a URL de callback do parceiro contra uma allowlist de hosts permitidos, mas ainda assim é explorada via SSRF. O que provavelmente faltou?"
    options:
      - "A allowlist deveria ter sido implementada como denylist, cobrindo os hosts internos conhecidos"
      - "A validação foi feita sobre a URL declarada, mas o destino final (após um redirect HTTP) não foi verificado contra a mesma allowlist"
      - "A aplicação deveria ter usado HTTPS em vez de HTTP na chamada de callback"
      - "O parceiro deveria assinar a URL de callback com uma chave privada antes de enviá-la"
    answer: 2
    explanation: "O padrão de bypass mais comum é validar a URL original e seguir um redirect (302) sem revalidar o destino final contra a mesma allowlist. HTTPS e assinatura não resolvem SSRF — o problema é o servidor fazer uma requisição para um destino não intencional, não a confidencialidade ou autenticidade do transporte."

  - question: "O que as falhas de desserialização insegura, path traversal, XXE e zip bomb têm em comum como causa raiz?"
    options:
      - "Todas dependem exclusivamente de uma versão desatualizada da JVM para serem exploráveis"
      - "Todas confiam no tipo de conteúdo declarado ou na extensão do arquivo, em vez de validar o conteúdo real recebido"
      - "Todas exigem que o atacante tenha credencial de administrador previamente"
      - "Todas são mitigadas integralmente pelo mesmo cabeçalho HTTP de segurança"
    answer: 1
    explanation: "O padrão comum é aceitar o que foi declarado — extensão do arquivo, cabeçalho de tipo, formato esperado — sem validar o conteúdo de fato recebido, que o atacante controla livremente. É por isso que a mitigação de cada uma passa por validar o conteúdo real, não apenas metadados fornecidos pelo cliente."

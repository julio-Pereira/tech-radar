questions:
  - question: "Um `payments-api` sobe com `&http.Server{Addr: \":8080\", Handler: mux}`. Mil clientes abrem conexão e mandam o cabeçalho um byte a cada dez segundos. O que acontece?"
    options:
      - "Nada grave: o servidor fecha conexões lentas depois de 30 segundos, o padrão da stdlib"
      - "Ele segura as mil conexões sem prazo: falta o `ReadHeaderTimeout`"
      - "O kernel descarta as conexões lentas antes que elas cheguem ao processo Go"
      - "O `ServeMux` recusa a requisição com 408 assim que percebe o cabeçalho incompleto"
    answer: 1
    explanation: "Um `http.Server` sem configuração não tem timeout nenhum. Cada conexão que goteja o cabeçalho fica aberta, e mil delas esgotam o servidor: é o ataque Slowloris. O `ReadHeaderTimeout` dá o prazo para terminar o cabeçalho, e o `gosec` acusa o servidor sem ele (G112). O mesmo raciocínio vale para o `http.Client` padrão, que também não tem timeout."

  - question: "O app reenviou `POST /entries` com a mesma `Idempotency-Key` porque a primeira tentativa deu timeout no cliente, mas ela ainda está processando no servidor. Qual implementação evita dois lançamentos?"
    options:
      - "Consultar se a chave existe e, se não existir, executar e gravar a chave no fim"
      - "Gravar a chave depois do lançamento, na mesma transação, e ignorar a repetição"
      - "Criar a entrada da chave antes de executar, sob trava, e a repetição esperar a primeira"
      - "Recusar com 409 toda requisição que chegue com uma chave já vista pelo servidor"
    answer: 2
    explanation: "Consultar e depois gravar abre uma janela em que as duas requisições veem a chave como nova e lançam. A entrada da chave nasce antes da execução, sob trava, e a repetição espera a primeira terminar para devolver a mesma resposta. 409 é para a mesma chave com corpo diferente, não para a repetição legítima, que precisa receber o resultado original."

  - question: "Na RFC 9457 (Problem Details), qual campo o cliente da API deve usar para decidir o que fazer com um erro?"
    options:
      - "`type`, um URI que identifica a classe do erro e não muda entre versões"
      - "`title`, porque é o resumo curto e legível que acompanha cada erro"
      - "`detail`, porque traz a explicação específica daquela ocorrência do erro"
      - "`instance`, que aponta para o recurso exato que provocou o erro na chamada"
    answer: 0
    explanation: "O `type` é o identificador estável da classe de erro (saldo insuficiente, chave reutilizada); `title` e `detail` são texto para gente e podem mudar, ser traduzidos ou reescritos. `instance` identifica a ocorrência. Um cliente que decide pelo texto quebra na primeira revisão de mensagem. A RFC 9457 substitui a 7807 com o mesmo formato."

  - question: "No deploy, o pod recebe `SIGTERM`. Qual sequência não perde lançamentos em voo?"
    options:
      - "Encerrar o processo na hora; o cliente repete e a idempotência resolve"
      - "Chamar `srv.Close()`, que fecha o listener e espera as requisições em voo"
      - "Esperar 30 segundos com `time.Sleep` antes de sair, para dar tempo às requisições"
      - "Readiness falsa e então `srv.Shutdown(ctx)`, que espera as requisições em voo"
    answer: 3
    explanation: "A readiness falsa tira o pod do balanceamento; `Shutdown` fecha o listener, espera as requisições em voo terminarem e fecha as ociosas, até o prazo do `ctx`. `Close` fecha tudo na hora, sem esperar. Sair direto deixa lançamento gravado sem resposta. A idempotência ajuda o cliente a repetir com segurança, mas não substitui terminar o trabalho."

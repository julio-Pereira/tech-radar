questions:
  - question: "O Postgres caiu. O que `/healthz` (liveness) e `/readyz` (readiness) devem responder?"
    options:
      - "Os dois 503, para o orquestrador reiniciar o pod e reconectar no banco"
      - "Os dois 200, porque o processo está de pé e a falha é do banco, não do serviço"
      - "`/healthz` 200 e `/readyz` 503: o pod sai do balanceamento, mas não é reiniciado"
      - "`/healthz` 503 e `/readyz` 200, para reiniciar sem perder o tráfego atual"
    answer: 2
    explanation: "Liveness responde se o processo travou; um banco fora não se resolve reiniciando o serviço, e reiniciar todos os pods ao mesmo tempo piora a recuperação. Readiness responde se dá para receber tráfego: com o banco fora, não dá, e o pod sai do balanceamento até o banco voltar. A readiness também fica falsa durante o drain do encerramento."

  - question: "O time quer garantir que um CPF nunca saia inteiro em log. Qual abordagem não depende de ninguém lembrar?"
    options:
      - "Uma regra de code review que proíbe passar o campo de CPF para qualquer chamada de log"
      - "Um tipo `CPF` que implementa `slog.LogValuer` e devolve sempre o valor mascarado"
      - "Um filtro no Collector que apaga do log qualquer campo cujo nome seja `cpf`"
      - "Desligar o log nas rotas que recebem dados pessoais do cliente da API"
    answer: 1
    explanation: "Com `LogValuer`, o `slog` chama `LogValue()` sempre que o valor vai para o log, e o tipo decide como aparece: mascarado, em qualquer handler. A revisão esquece; o filtro por nome de campo não pega `pagador` ou `titular`; desligar o log cega a operação. A mesma regra vale para atributos de span, que são log em outro backend."

  - question: "O `payments-api` sobe com `READ_TIMEOUT=cinco` no ambiente. Qual é o comportamento certo?"
    options:
      - "Subir com o timeout padrão e registrar um aviso para alguém corrigir depois"
      - "Subir normalmente e falhar só quando a primeira requisição precisar do timeout"
      - "Ignorar a variável e ler o valor de um arquivo de configuração embutido no binário"
      - "Recusar a subida com uma mensagem que cita a variável e o formato esperado"
    answer: 3
    explanation: "Config errada precisa derrubar o processo na subida, com mensagem clara, antes de abrir porta: o deploy falha na hora e o problema aparece para quem fez o deploy, não às 3h. Usar padrão silenciosamente esconde o erro, e um arquivo embutido quebra o 12-factor (o mesmo binário em todos os ambientes). Junte todas as falhas com `errors.Join`, não uma por deploy."

  - question: "Um `slog.Handler` customizado acrescenta `trace_id` a cada registro. O que ele precisa receber para saber o trace da requisição?"
    options:
      - "O `context.Context` da requisição, de onde lê o span ativo"
      - "Uma variável global com o trace atual, atualizada pelo middleware HTTP"
      - "O `*http.Request`, de onde lê o cabeçalho `traceparent` a cada chamada"
      - "Nada: o `slog` consulta o OpenTelemetry sozinho, sem nenhuma configuração"
    answer: 0
    explanation: "O span ativo viaja no `ctx`, e o `Handle(ctx, r)` do handler recebe esse contexto quando o log é feito com `InfoContext(ctx, ...)`. Uma variável global mistura requisições concorrentes; o `*http.Request` não chega a cada camada; o `slog` não sabe de OpenTelemetry sem o handler. Log feito com `Info` sem contexto sai sem `trace_id`."

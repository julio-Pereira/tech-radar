questions:
  - question: "Por que organizar pacotes como `controllers/`, `services/` e `repositories/` é considerado não idiomático em Go?"
    options:
      - "Porque o compilador penaliza as importações cíclicas que essa divisão inevitavelmente produz entre eles"
      - "Porque nomes no plural violam a convenção de nomenclatura de pacotes da stdlib"
      - "Porque essas camadas exigem interfaces explícitas, que Go não suporta declarar"
      - "Porque agrupa por papel técnico em vez de por domínio, espalhando um conceito por três pacotes"
    answer: 3
    explanation: "Em Go o pacote é a unidade de encapsulamento, e o que se quer encapsular é um domínio: `wallet/`, `ledger/`, `money/`. Dividir por camada faz cada conceito atravessar três pacotes e força exportar o que deveria ser interno. Nomes de pacote no singular são convenção, mas não são a razão principal."

  - question: "Um tipo exportado `AccountID` tem o campo não exportado e o construtor `Parse`, que valida o formato. O que ainda produz um `AccountID` sem passar pelo `Parse`?"
    options:
      - "Nada: com o campo não exportado, o compilador exige passar pelo construtor do pacote"
      - "Só reflexão com `unsafe`, que fica fora de qualquer garantia do sistema de tipos"
      - "O zero value: `var id account.AccountID` compila em qualquer pacote que o importe"
      - "Uma conversão `account.AccountID(\"acc-x\")`, já que o tipo base é uma string"
    answer: 2
    explanation: "Go não tem construtor obrigatório: toda variável nasce com o zero value do tipo, inclusive num pacote que não vê os campos. Por isso o desenho é dar significado ao zero value (\"nenhuma conta\"), expor `IsZero()` e rejeitá-lo em toda função que recebe o tipo. A conversão não compila porque o tipo é uma struct, não uma string."

  - question: "`type Kind int` com `Debit Kind = iota + 1` e `Credit`. Um `switch k { case Debit: ... }` sem tratar `Credit` chega à produção. Quem deveria ter barrado?"
    options:
      - "O compilador, que exige `default` em todo `switch` sobre tipo nomeado com constantes"
      - "O linter `exhaustive`, porque a linguagem não tem enum fechado e o `switch` incompleto compila"
      - "O `go vet`, que compara os casos do `switch` com todas as constantes declaradas do tipo"
      - "Ninguém: `iota` gera constantes privadas e o tipo só admite os valores declarados"
    answer: 1
    explanation: "Go não tem enum: `Kind` é um `int` com nome, `Kind(7)` compila, e um `switch` incompleto também. O `iota + 1` só garante que o zero value não seja `Debit` por acidente. A exaustividade vem de ferramenta: o `exhaustive` (no golangci-lint) reprova o `switch` que esquece uma constante. O `go vet` não faz essa checagem."

  - question: "Qual é o equivalente idiomático de `Optional<T>` em Go?"
    options:
      - "Um ponteiro `*T`, que é `nil` quando o valor está ausente"
      - "Múltiplos retornos: `(T, error)` quando falhou, `(T, bool)` quando pode não existir"
      - "Um tipo genérico `Option[T]` da stdlib, disponível desde a versão 1.18"
      - "Um valor zero do tipo, já que Go garante zero value útil para todo tipo"
    answer: 1
    explanation: "A convenção é devolver dois valores e deixar o chamador decidir: `error` quando a ausência é falha, `bool` quando ela é normal — o `v, ok := m[k]` do mapa é o exemplo canônico. Ponteiro serve para \"pode ser nulo\" e traz o custo de indireção e de `nil` panic. Não existe `Option` na stdlib."

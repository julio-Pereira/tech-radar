questions:
  - question: "O checkout chama o `payments-api` com 200 ms de prazo, que chama o antifraude por gRPC usando o mesmo `ctx`. O que o antifraude recebe?"
    options:
      - "Nenhum prazo: cada salto de rede começa com um timeout próprio, configurado no servidor"
      - "O mesmo prazo absoluto, vindo no cabeçalho da chamada e entregue no `ctx` do handler"
      - "Um prazo de 200 ms contados a partir da chegada da chamada ao antifraude"
      - "O prazo só quando o cliente gRPC é configurado com uma política de retry"
    answer: 1
    explanation: "O gRPC transmite o deadline do cliente no cabeçalho da chamada, e o servidor recebe o mesmo prazo absoluto no `ctx` (o restante, descontado o tempo já gasto). Se o antifraude chamar outro serviço com esse `ctx`, o prazo segue adiante. O teste com `bufconn` mostrou o servidor vendo um prazo positivo e menor que os 300 ms do cliente."

  - question: "Uma chamada gRPC de débito termina com `DeadlineExceeded`. O cliente pode repeti-la com segurança?"
    options:
      - "Sim: `DeadlineExceeded` garante que o servidor não chegou a executar a operação"
      - "Sim, desde que espere um backoff exponencial antes da nova tentativa"
      - "Só se o débito for idempotente: o prazo acabou, mas o débito pode ter acontecido"
      - "Não, porque o gRPC repete sozinho toda chamada que termina com esse código"
    answer: 2
    explanation: "O prazo acabou do lado do cliente, mas o servidor pode ter executado o débito e só não respondido a tempo. Repetir uma operação não idempotente pode debitar duas vezes. `Unavailable` (o servidor não estava lá) costuma ser seguro repetir. A política de retry do gRPC é configurada, não automática, e deve listar só métodos idempotentes, ou com chave de idempotência."

  - question: "Qual destas mudanças no `antifraude.proto` o `buf breaking` deve reprovar?"
    options:
      - "Trocar o tipo do campo `int64 valor = 3` para `string valor = 3`"
      - "Adicionar o campo novo `string canal = 4` à mensagem `AvaliarRequest`"
      - "Adicionar o valor `DECISAO_BLOQUEIO = 4` ao enum `Decisao`"
      - "Adicionar um método novo `AvaliarLote` ao `AntifraudeService`"
    answer: 0
    explanation: "Protobuf identifica o campo pelo número; trocar o tipo do campo 3 faz o consumidor antigo interpretar os bytes errado. O `buf breaking` reprovou exatamente essa mudança no teste, citando o campo `valor`. Campo novo, valor de enum novo e método novo são compatíveis (o cliente antigo ignora). Campo removido vira `reserved`, para o número não ser reaproveitado."

  - question: "O modelo de score do antifraude está fora do ar. Qual é a escolha correta entre falhar aberto (aprovar) e falhar fechado (negar)?"
    options:
      - "Falhar aberto, porque recusar transações legítimas custa mais caro que aprovar uma fraude"
      - "Falhar fechado, porque aprovar sem análise transfere o risco direto para a instituição"
      - "Nenhuma: o correto é enfileirar o pagamento e decidir quando o modelo voltar"
      - "Depende do negócio: decisão de risco com dono e registrada, não um default de código"
    answer: 3
    explanation: "As duas posturas são defensáveis, e o custo de cada uma depende do produto, do ticket e da exposição regulatória; a regra comum é aprovar até um valor e negar acima. O que não é aceitável é a escolha acontecer por acidente, num `if err != nil` que devolve aprovado. A resposta do antifraude marca `fallback: true` para a auditoria saber de onde veio a decisão."

# Pontes (`slug/NN` references inside a marco's body) that cite a trilha not
# yet published in this repo. TestBridgesResolve fails the build for any
# unresolved bridge NOT listed here — this file is the explicit, reviewed
# exception list, so a genuinely broken bridge can never hide silently.
#
# Each entry:
#   ref:    the exact reference text as written in the markdown (e.g. "design-de-codigo/09")
#   motivo: why it's cited before the trilha exists
#   ate:    a date to revisit — once the trilha ships, remove the entry and
#           let TestBridgesResolve confirm the real link resolves instead.
#
- ref: design-de-codigo/02
  motivo: "go-fintech/04 (interfaces pequenas no consumidor) aponta para o catálogo de padrões e SOLID da trilha design-de-codigo, ainda não publicada (plano da go-fintech, §4)."
  ate: 2027-05-01
- ref: design-de-codigo/05
  motivo: "spring-boot/04 (padrões que o Spring já usa) aponta para o catálogo de padrões da trilha design-de-codigo, ainda não publicada (adendo de entrevista da spring-boot, §4)."
  ate: 2027-05-01
- ref: aws-para-backend/08
  motivo: "terraform-e-iac/02 (saídas publicadas em SSM em vez de terraform_remote_state) e /03 (segredo lido do cofre) apontam para o marco de S3, KMS e segredos da trilha aws-para-backend, planejada para depois da terraform-e-iac (plano da terraform-e-iac, §7)."
  ate: 2027-05-01

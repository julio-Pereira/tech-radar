  dono: arquitetura-eventos/08
  apelidos: ["Idempotência", "idempotência", "idempotente", "idempotentes"]
  resumo: "Propriedade de uma operação que, repetida com a mesma entrada, produz o mesmo efeito que uma única execução — a defesa contra reentrega e retentativa em sistemas distribuídos."
  tambem: [system-design/05]


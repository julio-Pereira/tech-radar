# ── Eventos e dados ────────────────────────────────────────────────────────
# Outbox: o dono continua sendo arquitetura-eventos/08, que ensina o padrão
# independente de stack (dual-write, relay, garantias). spring-boot/06 é a
# implementação em Spring (insert-first, relay que espera o ack) e
# spring-boot/15 a versão in-process (Event Publication Registry): aparecem
# como aprofundamento, não como dono.
- id: outbox
  termo: "Outbox (transactional outbox)"
  dono: arquitetura-eventos/08
  apelidos: ["Outbox", "outbox"]
  tambem: [kafka/08, spring-boot/06, spring-boot/15]


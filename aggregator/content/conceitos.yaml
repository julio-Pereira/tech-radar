# Conceitos transversais: um dono por conceito; as outras trilhas citam e o
# compilador liga (internal/course/conceitos.go). Convenção: README, "Cross-track
# concepts: usar, não reensinar".
#
# Campos:
#   id           kebab-case, único e imutável (vira ponto de retorno na URL)
#   termo        nome exibido na prévia
#   dono         marco que ensina o conceito, na sintaxe das pontes (slug/NN)
#   apelidos     textos exatos que identificam o conceito; casam em fronteira de
#                palavra e, por padrão, com a caixa exata ("PAR" ≠ "par")
#   resumo       opcional; vazio = "Em uma frase" do verbete do glossário da
#                trilha dona cujo termo casa com um apelido
#   tambem       opcional; aprofundamentos aplicados, exibidos na prévia
#   ignorarCaixa opcional, padrão false
#   ignorarEm    opcional; marcos onde não ligar (além do próprio dono)
#   naoSeguidoDe opcional; regex do texto logo depois do apelido que anula a
#                ocorrência ("RFC 8705" é norma, não documento de decisão)
#
# Regras de ligação: só a primeira ocorrência de cada conceito por marco, no
# máximo 8 links de conceito por marco, nunca no marco dono, em títulos, em
# código ou dentro de links, nem num bloco que já tem ponte para o mesmo dono.
#
# Semente curada (Fase 4). Cada dono foi conferido no marco: o marco ensina o
# conceito e cita pelo menos um apelido. Fora de propósito: palavras comuns
# (Taxa, Fase, Política, Estado, Token...) e siglas ambíguas (TTL). PAN ficou
# fora porque o marco que o ensina (pagamentos-e-liquidacao/04) diz "número do
# cartão" e nunca "PAN". JOSE, JWE, DPoP e CIBA ficaram fora por não serem
# citados (e ligados) fora do próprio marco dono: não são transversais hoje.

# ── Segurança: JOSE, OAuth e FAPI ──────────────────────────────────────────
- id: jws
  termo: "JWS (JSON Web Signature)"
  dono: seguranca-aplicacao/04
  apelidos: ["JWS", "JSON Web Signature"]

- id: jwt
  termo: "JWT (JSON Web Token)"
  dono: seguranca-aplicacao/04
  apelidos: ["JWT", "JWTs", "JSON Web Token"]
  resumo: "Token compacto com cabeçalho, claims e assinatura em base64url; na prática quase sempre um JWS, legível por qualquer um e verificável só por quem tem a chave."

- id: jwks
  termo: "JWKS (JSON Web Key Set)"
  dono: seguranca-aplicacao/04
  apelidos: ["JWKS"]
  tambem: [open-finance-brasil/02]

- id: private-key-jwt
  termo: "private_key_jwt"
  dono: seguranca-aplicacao/05
  apelidos: ["private_key_jwt"]
  resumo: "Autenticação do client no servidor de autorização por uma afirmação JWT assinada com a chave privada do próprio client, em vez de um segredo compartilhado."
  tambem: [open-finance-brasil/03]

- id: pkce
  termo: "PKCE (Proof Key for Code Exchange)"
  dono: seguranca-aplicacao/05
  apelidos: ["PKCE"]

- id: par
  termo: "PAR (Pushed Authorization Request)"
  dono: seguranca-aplicacao/05
  apelidos: ["PAR", "Pushed Authorization Request"]
  tambem: [open-finance-brasil/03]

- id: fapi
  termo: "FAPI (Financial-grade API)"
  dono: seguranca-aplicacao/07
  apelidos: ["FAPI"]
  resumo: "Perfil de segurança da OpenID Foundation para APIs financeiras: endurece OAuth 2.0 e OpenID Connect (PAR, mTLS ou private_key_jwt, tokens vinculados ao cliente) e é a base do Open Finance Brasil."
  tambem: [open-finance-brasil/03]

- id: mtls
  termo: "mTLS (TLS mútuo)"
  dono: seguranca-aplicacao/07
  apelidos: ["mTLS", "TLS mútuo"]
  tambem: [open-finance-brasil/03]

- id: sbom
